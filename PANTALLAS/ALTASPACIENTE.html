<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altas de Paciente - MEGASYS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">
                <i class="fas fa-user-plus mr-2"></i>
                Altas de Paciente - MEGASYS
            </h1>
            <div class="flex items-center space-x-4">
                <span class="text-sm">Usuario: <span id="currentUser">Admin</span></span>
                <button onclick="window.location.href='../index.html'" class="bg-blue-500 hover:bg-blue-700 px-3 py-1 rounded">
                    <i class="fas fa-home mr-1"></i>
                    Inicio
                </button>
            </div>
        </div>
    </header>

    <div class="container mx-auto p-6 max-w-4xl">
        <!-- Patient Information Form -->
        <div class="bg-white rounded-lg shadow-lg p-6">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg font-semibold text-gray-800">
                    <i class="fas fa-clipboard mr-2"></i>
                    Ficha Clínica - Alta de Paciente
                </h3>
                <div class="text-sm text-gray-600">
                    <span class="font-medium">Fecha de Carga:</span> 
                    <span id="loadDate">11/01/2025</span>
                </div>
            </div>
            
            <form id="patientForm" class="space-y-6">
                <!-- Personal Information -->
                <div class="bg-gray-50 p-4 rounded-lg">
                    <h4 class="text-md font-semibold text-gray-800 mb-4">Información Personal</h4>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Historia Clínica*</label>
                            <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" 
                                   placeholder="HC-" id="clinicalHistory" required>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Número de Movimiento*</label>
                            <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" 
                                   placeholder="MOV-" id="movementNumber" required>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Tipo de Documento*</label>
                            <select class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" 
                                    id="documentType" required>
                                <option value="">Seleccionar</option>
                                <option value="DNI">DNI</option>
                                <option value="Pasaporte">Pasaporte</option>
                                <option value="Cedula">Cédula</option>
                                <option value="Libreta">Libreta Cívica</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Apellidos y Nombres*</label>
                            <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" 
                                   placeholder="Apellidos, Nombres" id="fullName" required>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Número de Documento*</label>
                            <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" 
                                   placeholder="Número de documento" id="documentNumber" required>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Fecha de Nacimiento*</label>
                            <input type="date" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" 
                                   id="birthDate" required>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Sexo*</label>
                            <select class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" 
                                    id="gender" required>
                                <option value="">Seleccionar</option>
                                <option value="M">Masculino</option>
                                <option value="F">Femenino</option>
                            </select>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Estado Civil</label>
                            <select class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" 
                                    id="maritalStatus">
                                <option value="">Seleccionar</option>
                                <option value="Soltero">Soltero/a</option>
                                <option value="Casado">Casado/a</option>
                                <option value="Divorciado">Divorciado/a</option>
                                <option value="Viudo">Viudo/a</option>
                                <option value="Separado">Separado/a</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Contact Information -->
                <div class="bg-gray-50 p-4 rounded-lg">
                    <h4 class="text-md font-semibold text-gray-800 mb-4">Información de Contacto</h4>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Dirección</label>
                            <textarea class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" 
                                      rows="2" placeholder="Dirección completa" id="address"></textarea>
                        </div>
                        
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
                                <input type="tel" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" 
                                       placeholder="(011) 1234-5678" id="phone">
                            </div>
                            
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Celular</label>
                                <input type="tel" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" 
                                       placeholder="(011) 15-1234-5678" id="mobile">
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                            <input type="email" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" 
                                   placeholder="correo@ejemplo.com" id="email">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Ocupación</label>
                            <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" 
                                   placeholder="Ocupación laboral" id="occupation">
                        </div>
                    </div>
                </div>

                <!-- Insurance Information -->
                <div class="bg-gray-50 p-4 rounded-lg">
                    <h4 class="text-md font-semibold text-gray-800 mb-4">Información de Obra Social</h4>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Obra Social</label>
                            <div class="flex">
                                <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded-l-md focus:outline-none focus:ring-2 focus:ring-blue-500" 
                                       placeholder="Seleccionar obra social" id="insurance">
                                <button type="button" onclick="searchInsurance()" 
                                        class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-2 rounded-r-md">
                                    <i class="fas fa-search"></i>
                                </button>
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Número de Afiliado</label>
                            <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" 
                                   placeholder="Número de afiliado" id="memberNumber">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Plan</label>
                            <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" 
                                   placeholder="Plan de cobertura" id="plan">
                        </div>
                    </div>
                </div>

                <!-- Emergency Contact -->
                <div class="bg-gray-50 p-4 rounded-lg">
                    <h4 class="text-md font-semibold text-gray-800 mb-4">Contacto de Emergencia</h4>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Nombre Completo</label>
                            <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" 
                                   placeholder="Nombre del contacto de emergencia" id="emergencyName">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Relación</label>
                            <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" 
                                   placeholder="Relación (ej: cónyuge, hijo, etc.)" id="emergencyRelation">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
                            <input type="tel" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" 
                                   placeholder="Teléfono de emergencia" id="emergencyPhone">
                        </div>
                    </div>
                </div>

                <!-- Observations -->
                <div class="bg-gray-50 p-4 rounded-lg">
                    <h4 class="text-md font-semibold text-gray-800 mb-4">Observaciones</h4>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Observaciones del Paciente</label>
                        <textarea class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" 
                                  rows="4" placeholder="Antecedentes médicos, alergias, medicamentos actuales, etc." 
                                  id="observations"></textarea>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex justify-center space-x-4 pt-6">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-medium">
                        <i class="fas fa-save mr-2"></i>
                        Guardar Paciente
                    </button>
                    <button type="button" onclick="clearForm()" class="bg-gray-600 hover:bg-gray-700 text-white px-6 py-3 rounded-lg font-medium">
                        <i class="fas fa-eraser mr-2"></i>
                        Limpiar Formulario
                    </button>
                    <button type="button" onclick="printCard()" class="bg-purple-600 hover:bg-purple-700 text-white px-6 py-3 rounded-lg font-medium">
                        <i class="fas fa-print mr-2"></i>
                        Imprimir Ficha
                    </button>
                    <button type="button" onclick="cancel()" class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-lg font-medium">
                        <i class="fas fa-times mr-2"></i>
                        Cancelar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function generateClinicalHistory() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const random = Math.floor(Math.random() * 9999).toString().padStart(4, '0');
            return `HC-${year}${month}${random}`;
        }

        function generateMovementNumber() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const random = Math.floor(Math.random() * 999).toString().padStart(3, '0');
            return `MOV-${year}${month}${day}${random}`;
        }

        function searchInsurance() {
            alert('Búsqueda de obras sociales');
        }

        function clearForm() {
            if (confirm('¿Está seguro de limpiar todos los campos del formulario?')) {
                document.getElementById('patientForm').reset();
                generateNumbers();
            }
        }

        function printCard() {
            const form = document.getElementById('patientForm');
            if (!form.checkValidity()) {
                alert('Por favor complete todos los campos obligatorios antes de imprimir');
                return;
            }
            alert('Imprimiendo ficha del paciente...');
        }

        function cancel() {
            if (confirm('¿Desea cancelar y volver al menú principal?')) {
                window.location.href = '../index.html';
            }
        }

        function generateNumbers() {
            document.getElementById('clinicalHistory').value = generateClinicalHistory();
            document.getElementById('movementNumber').value = generateMovementNumber();
        }

        // Form submission handler
        document.getElementById('patientForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Validate required fields
            const requiredFields = ['clinicalHistory', 'movementNumber', 'documentType', 'fullName', 'documentNumber', 'birthDate', 'gender'];
            let isValid = true;
            
            requiredFields.forEach(fieldId => {
                const field = document.getElementById(fieldId);
                if (!field.value.trim()) {
                    field.classList.add('border-red-500');
                    isValid = false;
                } else {
                    field.classList.remove('border-red-500');
                }
            });

            if (!isValid) {
                alert('Por favor complete todos los campos obligatorios marcados con *');
                return;
            }

            // Additional validations
            const email = document.getElementById('email').value;
            if (email && !isValidEmail(email)) {
                alert('Por favor ingrese un email válido');
                return;
            }

            const birthDate = new Date(document.getElementById('birthDate').value);
            const today = new Date();
            if (birthDate > today) {
                alert('La fecha de nacimiento no puede ser futura');
                return;
            }

            // Success
            alert('Paciente registrado exitosamente');
            
            // Ask if user wants to register another patient
            if (confirm('¿Desea registrar otro paciente?')) {
                clearForm();
            } else {
                window.location.href = '../index.html';
            }
        });

        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        // Load user info and generate numbers on page load
        document.addEventListener('DOMContentLoaded', function() {
            const user = localStorage.getItem('megasys_user') || 'Admin';
            document.getElementById('currentUser').textContent = user;
            
            // Set current date
            const today = new Date().toLocaleDateString('es-ES');
            document.getElementById('loadDate').textContent = today;
            
            // Generate numbers
            generateNumbers();
        });
    </script>
</body>
</html>
