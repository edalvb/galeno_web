<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEG@SYS - Lista de Empresas Aseguradoras</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'medical-blue': '#2563eb',
                        'medical-green': '#059669',
                        'medical-red': '#dc2626'
                    }
                }
            }
        }
    </script>
    <style>
        @media print {
            .no-print { display: none !important; }
            body { print-color-adjust: exact; }
            .print-header { display: block !important; }
        }
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .stats-card {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        .insurance-card {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="gradient-bg text-white shadow-lg no-print">
        <div class="container mx-auto px-4 py-6">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <i class="fas fa-shield-alt text-3xl"></i>
                    <div>
                        <h1 class="text-2xl font-bold">Sistema MEG@SYS</h1>
                        <p class="text-blue-100">Gestión de Empresas Aseguradoras</p>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <button onclick="window.print()" class="bg-white text-blue-600 px-4 py-2 rounded-lg hover:bg-blue-50 transition-colors">
                        <i class="fas fa-print mr-2"></i>Imprimir
                    </button>
                    <button onclick="window.history.back()" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition-colors">
                        <i class="fas fa-arrow-left mr-2"></i>Volver
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Print Header -->
    <div class="print-header hidden">
        <div class="text-center border-b-2 border-blue-600 pb-4 mb-6">
            <h1 class="text-2xl font-bold text-blue-800">LISTADO DE EMPRESAS ASEGURADORAS</h1>
            <p class="text-gray-600">Sistema MEG@SYS - Reporte Generado el <span id="print-date"></span></p>
        </div>
    </div>

    <div class="container mx-auto px-4 py-6">
        <!-- Controls Section -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6 no-print">
            <div class="flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center space-x-4">
                    <div class="relative">
                        <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        <input type="text" id="searchInput" placeholder="Buscar por código, nombre, teléfono o dirección..." 
                               class="pl-10 pr-4 py-2 w-96 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <select id="tipoFiltro" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                        <option value="">Todos los Tipos</option>
                        <option value="EPS">EPS</option>
                        <option value="ARS">ARS</option>
                        <option value="PREPAGADA">Prepagada</option>
                        <option value="PARTICULAR">Particular</option>
                    </select>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="text-sm text-gray-600">Vista:</span>
                    <button id="viewCards" onclick="toggleView('cards')" class="px-3 py-1 bg-blue-500 text-white rounded-lg text-sm hover:bg-blue-600 transition-colors">
                        <i class="fas fa-th-large mr-1"></i>Tarjetas
                    </button>
                    <button id="viewTable" onclick="toggleView('table')" class="px-3 py-1 bg-gray-300 text-gray-700 rounded-lg text-sm hover:bg-gray-400 transition-colors">
                        <i class="fas fa-table mr-1"></i>Tabla
                    </button>
                </div>
            </div>
        </div>

        <!-- Statistics Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-6">
            <div class="stats-card text-white p-6 rounded-lg shadow-lg">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-blue-100 text-sm uppercase tracking-wide">Total Aseguradoras</p>
                        <p class="text-3xl font-bold" id="totalAseguradoras">0</p>
                    </div>
                    <i class="fas fa-shield-alt text-4xl text-blue-200"></i>
                </div>
            </div>
            <div class="bg-gradient-to-r from-green-400 to-green-600 text-white p-6 rounded-lg shadow-lg">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-green-100 text-sm uppercase tracking-wide">EPS Activas</p>
                        <p class="text-3xl font-bold" id="totalEPS">0</p>
                    </div>
                    <i class="fas fa-hospital text-4xl text-green-200"></i>
                </div>
            </div>
            <div class="bg-gradient-to-r from-purple-400 to-purple-600 text-white p-6 rounded-lg shadow-lg">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-purple-100 text-sm uppercase tracking-wide">ARS Activas</p>
                        <p class="text-3xl font-bold" id="totalARS">0</p>
                    </div>
                    <i class="fas fa-user-shield text-4xl text-purple-200"></i>
                </div>
            </div>
            <div class="bg-gradient-to-r from-orange-400 to-orange-600 text-white p-6 rounded-lg shadow-lg">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-orange-100 text-sm uppercase tracking-wide">Prepagadas</p>
                        <p class="text-3xl font-bold" id="totalPrepagadas">0</p>
                    </div>
                    <i class="fas fa-credit-card text-4xl text-orange-200"></i>
                </div>
            </div>
        </div>

        <!-- Add New Button -->
        <div class="mb-6 no-print">
            <button onclick="agregarAseguradora()" class="bg-green-500 text-white px-6 py-3 rounded-lg hover:bg-green-600 transition-colors shadow-lg">
                <i class="fas fa-plus mr-2"></i>Agregar Nueva Aseguradora
            </button>
        </div>

        <!-- Cards View -->
        <div id="cardsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards will be generated here -->
        </div>

        <!-- Table View -->
        <div id="tableContainer" class="hidden">
            <div class="bg-white rounded-lg shadow-lg overflow-hidden">
                <table class="min-w-full">
                    <thead class="bg-blue-600 text-white">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Código</th>
                            <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Nombre</th>
                            <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Teléfono</th>
                            <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Dirección</th>
                            <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider no-print">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="bg-white divide-y divide-gray-200">
                        <!-- Table rows will be generated here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal for Add/Edit -->
    <div id="modalAseguradora" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden z-50 no-print">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg shadow-xl max-w-md w-full">
                <div class="bg-blue-600 text-white px-6 py-4 rounded-t-lg">
                    <h3 class="text-lg font-semibold" id="modalTitle">Agregar Nueva Aseguradora</h3>
                </div>
                <form id="formAseguradora" class="p-6">
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Código</label>
                        <input type="text" id="modalCodigo" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Nombre</label>
                        <input type="text" id="modalNombre" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Teléfono</label>
                        <input type="tel" id="modalTelefono" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Dirección</label>
                        <textarea id="modalDireccion" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"></textarea>
                    </div>
                    <div class="flex justify-end space-x-3">
                        <button type="button" onclick="cerrarModal()" class="px-4 py-2 text-gray-700 bg-gray-200 rounded-lg hover:bg-gray-300 transition-colors">
                            Cancelar
                        </button>
                        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                            Guardar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Sample data for demonstration
        let aseguradoras = [
            {
                id: 'AS001',
                nombre: 'NUEVA EPS',
                telefono: '01-8000-123456',
                direccion: 'Calle 100 #12-34, Bogotá',
                tipo: 'EPS'
            },
            {
                id: 'AS002', 
                nombre: 'COMPENSAR EPS',
                telefono: '01-307-5555',
                direccion: 'Av. 68 #49A-47, Bogotá',
                tipo: 'EPS'
            },
            {
                id: 'AS003',
                nombre: 'FAMISANAR EPS',
                telefono: '01-307-4000',
                direccion: 'Calle 34 #17-00, Bogotá', 
                tipo: 'EPS'
            },
            {
                id: 'AS004',
                nombre: 'SURA ARS',
                telefono: '01-560-1111',
                direccion: 'Carrera 69A #9-11, Bogotá',
                tipo: 'ARS'
            },
            {
                id: 'AS005',
                nombre: 'COLSANITAS',
                telefono: '01-595-5555',
                direccion: 'Calle 95 #30-05, Bogotá',
                tipo: 'PREPAGADA'
            },
            {
                id: 'AS006',
                nombre: 'COOMEVA MP',
                telefono: '01-744-4444',
                direccion: 'Carrera 25 #4-44, Cali',
                tipo: 'PREPAGADA'
            }
        ];

        let currentView = 'cards';
        let editingId = null;

        function initializeApp() {
            renderAseguradoras();
            updateStatistics();
            setupEventListeners();
            updatePrintDate();
        }

        function setupEventListeners() {
            document.getElementById('searchInput').addEventListener('input', filterAseguradoras);
            document.getElementById('tipoFiltro').addEventListener('change', filterAseguradoras);
            document.getElementById('formAseguradora').addEventListener('submit', guardarAseguradora);
        }

        function updatePrintDate() {
            document.getElementById('print-date').textContent = new Date().toLocaleDateString('es-ES');
        }

        function renderAseguradoras() {
            if (currentView === 'cards') {
                renderCards();
            } else {
                renderTable();
            }
        }

        function renderCards() {
            const container = document.getElementById('cardsContainer');
            const filteredData = getFilteredAseguradoras();
            
            container.innerHTML = filteredData.map(aseguradora => `
                <div class="insurance-card text-white rounded-lg shadow-lg card-hover transition-all duration-300">
                    <div class="p-6">
                        <div class="flex items-center justify-between mb-4">
                            <div class="flex items-center space-x-3">
                                <div class="bg-white bg-opacity-20 p-3 rounded-full">
                                    <i class="fas fa-shield-alt text-2xl"></i>
                                </div>
                                <div>
                                    <h3 class="text-lg font-bold">${aseguradora.nombre}</h3>
                                    <p class="text-blue-100">Código: ${aseguradora.id}</p>
                                </div>
                            </div>
                            <span class="px-3 py-1 bg-white bg-opacity-20 rounded-full text-sm font-medium">
                                ${aseguradora.tipo}
                            </span>
                        </div>
                        
                        <div class="space-y-2 mb-4">
                            <div class="flex items-center space-x-2">
                                <i class="fas fa-phone text-blue-200"></i>
                                <span class="text-sm">${aseguradora.telefono}</span>
                            </div>
                            <div class="flex items-start space-x-2">
                                <i class="fas fa-map-marker-alt text-blue-200 mt-1"></i>
                                <span class="text-sm">${aseguradora.direccion}</span>
                            </div>
                        </div>
                        
                        <div class="flex space-x-2 no-print">
                            <button onclick="editarAseguradora('${aseguradora.id}')" 
                                    class="flex-1 bg-white bg-opacity-20 hover:bg-opacity-30 text-white px-4 py-2 rounded-lg transition-colors">
                                <i class="fas fa-edit mr-2"></i>Editar
                            </button>
                            <button onclick="eliminarAseguradora('${aseguradora.id}')" 
                                    class="flex-1 bg-red-500 bg-opacity-80 hover:bg-opacity-100 text-white px-4 py-2 rounded-lg transition-colors">
                                <i class="fas fa-trash mr-2"></i>Eliminar
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const filteredData = getFilteredAseguradoras();
            
            tbody.innerHTML = filteredData.map(aseguradora => `
                <tr class="hover:bg-gray-50">
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${aseguradora.id}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${aseguradora.nombre}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${aseguradora.telefono}</td>
                    <td class="px-6 py-4 text-sm text-gray-900">${aseguradora.direccion}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium no-print">
                        <button onclick="editarAseguradora('${aseguradora.id}')" class="text-blue-600 hover:text-blue-900 mr-3">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button onclick="eliminarAseguradora('${aseguradora.id}')" class="text-red-600 hover:text-red-900">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function getFilteredAseguradoras() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const tipoFiltro = document.getElementById('tipoFiltro').value;
            
            return aseguradoras.filter(aseguradora => {
                const matchesSearch = !searchTerm || 
                    aseguradora.id.toLowerCase().includes(searchTerm) ||
                    aseguradora.nombre.toLowerCase().includes(searchTerm) ||
                    aseguradora.telefono.toLowerCase().includes(searchTerm) ||
                    aseguradora.direccion.toLowerCase().includes(searchTerm);
                
                const matchesTipo = !tipoFiltro || aseguradora.tipo === tipoFiltro;
                
                return matchesSearch && matchesTipo;
            });
        }

        function filterAseguradoras() {
            renderAseguradoras();
        }

        function toggleView(view) {
            currentView = view;
            
            const cardsContainer = document.getElementById('cardsContainer');
            const tableContainer = document.getElementById('tableContainer');
            const viewCards = document.getElementById('viewCards');
            const viewTable = document.getElementById('viewTable');
            
            if (view === 'cards') {
                cardsContainer.classList.remove('hidden');
                tableContainer.classList.add('hidden');
                viewCards.classList.remove('bg-gray-300', 'text-gray-700');
                viewCards.classList.add('bg-blue-500', 'text-white');
                viewTable.classList.remove('bg-blue-500', 'text-white');
                viewTable.classList.add('bg-gray-300', 'text-gray-700');
            } else {
                cardsContainer.classList.add('hidden');
                tableContainer.classList.remove('hidden');
                viewTable.classList.remove('bg-gray-300', 'text-gray-700');
                viewTable.classList.add('bg-blue-500', 'text-white');
                viewCards.classList.remove('bg-blue-500', 'text-white');
                viewCards.classList.add('bg-gray-300', 'text-gray-700');
            }
            
            renderAseguradoras();
        }

        function updateStatistics() {
            const total = aseguradoras.length;
            const eps = aseguradoras.filter(a => a.tipo === 'EPS').length;
            const ars = aseguradoras.filter(a => a.tipo === 'ARS').length;
            const prepagadas = aseguradoras.filter(a => a.tipo === 'PREPAGADA').length;
            
            document.getElementById('totalAseguradoras').textContent = total;
            document.getElementById('totalEPS').textContent = eps;
            document.getElementById('totalARS').textContent = ars;
            document.getElementById('totalPrepagadas').textContent = prepagadas;
        }

        function agregarAseguradora() {
            editingId = null;
            document.getElementById('modalTitle').textContent = 'Agregar Nueva Aseguradora';
            document.getElementById('formAseguradora').reset();
            document.getElementById('modalAseguradora').classList.remove('hidden');
        }

        function editarAseguradora(id) {
            editingId = id;
            const aseguradora = aseguradoras.find(a => a.id === id);
            
            document.getElementById('modalTitle').textContent = 'Editar Aseguradora';
            document.getElementById('modalCodigo').value = aseguradora.id;
            document.getElementById('modalNombre').value = aseguradora.nombre;
            document.getElementById('modalTelefono').value = aseguradora.telefono;
            document.getElementById('modalDireccion').value = aseguradora.direccion;
            
            document.getElementById('modalAseguradora').classList.remove('hidden');
        }

        function guardarAseguradora(event) {
            event.preventDefault();
            
            const formData = {
                id: document.getElementById('modalCodigo').value.trim(),
                nombre: document.getElementById('modalNombre').value.trim(),
                telefono: document.getElementById('modalTelefono').value.trim(),
                direccion: document.getElementById('modalDireccion').value.trim(),
                tipo: determinarTipo(document.getElementById('modalNombre').value.trim())
            };
            
            if (editingId) {
                // Edit existing
                const index = aseguradoras.findIndex(a => a.id === editingId);
                if (index !== -1) {
                    aseguradoras[index] = formData;
                }
            } else {
                // Add new
                if (aseguradoras.find(a => a.id === formData.id)) {
                    alert('Ya existe una aseguradora con ese código');
                    return;
                }
                aseguradoras.push(formData);
            }
            
            renderAseguradoras();
            updateStatistics();
            cerrarModal();
        }

        function determinarTipo(nombre) {
            const nombreUpper = nombre.toUpperCase();
            if (nombreUpper.includes('EPS')) return 'EPS';
            if (nombreUpper.includes('ARS')) return 'ARS';
            if (nombreUpper.includes('PREPAGADA') || nombreUpper.includes('COLSANITAS') || nombreUpper.includes('COOMEVA')) return 'PREPAGADA';
            return 'PARTICULAR';
        }

        function eliminarAseguradora(id) {
            if (confirm('¿Está seguro de que desea eliminar esta aseguradora?')) {
                aseguradoras = aseguradoras.filter(a => a.id !== id);
                renderAseguradoras();
                updateStatistics();
            }
        }

        function cerrarModal() {
            document.getElementById('modalAseguradora').classList.add('hidden');
            editingId = null;
        }

        // Initialize the application
        document.addEventListener('DOMContentLoaded', initializeApp);
    </script>
</body>
</html>
