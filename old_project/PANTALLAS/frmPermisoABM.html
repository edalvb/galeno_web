<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permisos de ABM - MEGASYS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-md mx-4">
        <div class="p-6">
            <!-- Header -->
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-lg font-semibold text-gray-800">
                    <i class="fas fa-shield-alt mr-2 text-blue-600"></i>
                    PERMISOS DE ABM
                </h3>
                <button onclick="cerrarVentana()" class="text-gray-400 hover:text-gray-600">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- Usuario Info -->
            <div class="mb-4 p-3 bg-blue-50 rounded-lg border border-blue-200">
                <div class="flex items-center">
                    <i class="fas fa-user mr-2 text-blue-600"></i>
                    <span class="text-sm font-medium text-blue-800">Usuario:</span>
                    <span id="lblUsuario" class="ml-2 text-sm text-blue-900 font-semibold">Admin</span>
                </div>
            </div>

            <!-- Permisos Disponibles -->
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    <i class="fas fa-list mr-1"></i>
                    Permisos Disponibles
                </label>
                <div class="border border-gray-300 rounded-md max-h-48 overflow-y-auto">
                    <select id="dblstPermABM" size="8" class="w-full p-2 focus:outline-none focus:ring-2 focus:ring-blue-500" onchange="seleccionarModulo()">
                        <!-- Opciones se cargarán dinámicamente -->
                    </select>
                </div>
            </div>

            <!-- Checkboxes ABM -->
            <div class="mb-6">
                <div class="border border-gray-300 rounded-lg p-4 bg-gray-50">
                    <div class="grid grid-cols-3 gap-4">
                        <label class="flex items-center cursor-pointer">
                            <input type="checkbox" id="chkAlta" class="mr-2 text-blue-600 focus:ring-blue-500" onchange="marcarCambio()">
                            <span class="text-sm font-medium text-gray-700">
                                <i class="fas fa-plus mr-1 text-green-600"></i>
                                Agregar
                            </span>
                        </label>
                        
                        <label class="flex items-center cursor-pointer">
                            <input type="checkbox" id="chkBaja" class="mr-2 text-blue-600 focus:ring-blue-500" onchange="marcarCambio()">
                            <span class="text-sm font-medium text-gray-700">
                                <i class="fas fa-trash mr-1 text-red-600"></i>
                                Borrar
                            </span>
                        </label>
                        
                        <label class="flex items-center cursor-pointer">
                            <input type="checkbox" id="chkModificacion" class="mr-2 text-blue-600 focus:ring-blue-500" onchange="marcarCambio()">
                            <span class="text-sm font-medium text-gray-700">
                                <i class="fas fa-edit mr-1 text-yellow-600"></i>
                                Modificar
                            </span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Botones -->
            <div class="flex justify-end space-x-2">
                <button onclick="cerrarVentana()" class="px-4 py-2 border border-gray-300 rounded text-gray-700 hover:bg-gray-50 transition">
                    <i class="fas fa-times mr-1"></i>
                    Cancelar
                </button>
                <button id="btnGrabar" onclick="grabarPermisos()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    <i class="fas fa-save mr-1"></i>
                    Grabar
                </button>
            </div>

            <!-- Status Bar -->
            <div class="mt-4 p-2 bg-gray-100 rounded text-sm text-gray-600 text-center">
                <span id="statusMessage">Seleccione un módulo para configurar permisos</span>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg p-6 text-center">
            <i class="fas fa-spinner fa-spin text-3xl text-blue-600 mb-4"></i>
            <p class="text-gray-700">Cargando permisos...</p>
        </div>
    </div>

    <script>
        // Variables globales
        let permisosData = [];
        let permisosCheck = [];
        let usuarioActual = '';
        let moduloSeleccionado = '';
        let hayCambios = false;

        // Datos de ejemplo - En una aplicación real vendrían de la base de datos
        const permisosEjemplo = [
            { descripcion: 'Gestión de Pacientes', codmodulo: 'PAC001', alta: true, baja: false, modificacion: true },
            { descripcion: 'Historia Clínica', codmodulo: 'HIS001', alta: true, baja: true, modificacion: true },
            { descripcion: 'Facturación', codmodulo: 'FAC001', alta: false, baja: false, modificacion: true },
            { descripcion: 'Mantenimiento de Usuarios', codmodulo: 'USU001', alta: true, baja: true, modificacion: true },
            { descripcion: 'Reportes Médicos', codmodulo: 'REP001', alta: false, baja: false, modificacion: false },
            { descripcion: 'Liquidaciones', codmodulo: 'LIQ001', alta: true, baja: false, modificacion: true },
            { descripcion: 'Movimientos', codmodulo: 'MOV001', alta: true, baja: true, modificacion: true },
            { descripcion: 'Configuración', codmodulo: 'CON001', alta: false, baja: false, modificacion: true }
        ];

        function inicializar() {
            // Obtener parámetros de la URL
            const params = new URLSearchParams(window.location.search);
            const usuario = params.get('usuario') || 'Admin';
            
            document.getElementById('lblUsuario').textContent = usuario;
            usuarioActual = usuario;
            
            cargarPermisos();
        }

        function cargarPermisos() {
            mostrarLoading(true);
            
            // Simular carga desde base de datos
            setTimeout(() => {
                permisosData = [...permisosEjemplo];
                permisosCheck = [...permisosEjemplo];
                
                poblarListaModulos();
                configurarBotones(true);
                
                mostrarLoading(false);
                updateStatus('Permisos cargados correctamente');
            }, 1000);
        }

        function poblarListaModulos() {
            const select = document.getElementById('dblstPermABM');
            select.innerHTML = '';
            
            permisosData.forEach((permiso, index) => {
                const option = document.createElement('option');
                option.value = permiso.codmodulo;
                option.textContent = permiso.descripcion;
                option.dataset.index = index;
                select.appendChild(option);
            });
            
            // Seleccionar el primer elemento si existe
            if (permisosData.length > 0) {
                select.selectedIndex = 0;
                seleccionarModulo();
            }
        }

        function seleccionarModulo() {
            const select = document.getElementById('dblstPermABM');
            const selectedOption = select.options[select.selectedIndex];
            
            if (selectedOption) {
                moduloSeleccionado = selectedOption.value;
                const index = parseInt(selectedOption.dataset.index);
                const permisos = permisosCheck[index];
                
                // Actualizar checkboxes
                document.getElementById('chkAlta').checked = permisos.alta;
                document.getElementById('chkBaja').checked = permisos.baja;
                document.getElementById('chkModificacion').checked = permisos.modificacion;
                
                // Habilitar checkboxes
                habilitarCheckboxes(true);
                
                updateStatus(`Módulo seleccionado: ${selectedOption.textContent}`);
            } else {
                habilitarCheckboxes(false);
                updateStatus('No hay módulos disponibles');
            }
        }

        function habilitarCheckboxes(enabled) {
            document.getElementById('chkAlta').disabled = !enabled;
            document.getElementById('chkBaja').disabled = !enabled;
            document.getElementById('chkModificacion').disabled = !enabled;
        }

        function marcarCambio() {
            if (!moduloSeleccionado) return;
            
            const select = document.getElementById('dblstPermABM');
            const selectedOption = select.options[select.selectedIndex];
            
            if (selectedOption) {
                const index = parseInt(selectedOption.dataset.index);
                
                // Actualizar los permisos en memoria
                permisosCheck[index].alta = document.getElementById('chkAlta').checked;
                permisosCheck[index].baja = document.getElementById('chkBaja').checked;
                permisosCheck[index].modificacion = document.getElementById('chkModificacion').checked;
                
                hayCambios = true;
                habilitarBotonGrabar(true);
                updateStatus('Permisos modificados - Recuerde grabar los cambios');
            }
        }

        function grabarPermisos() {
            if (!hayCambios) {
                updateStatus('No hay cambios para guardar');
                return;
            }
            
            mostrarLoading(true);
            
            // Simular grabación en base de datos
            setTimeout(() => {
                try {
                    // Aquí se harían las actualizaciones a la base de datos
                    // rsPermisoCheck.UpdateBatch adAffectAllChapters
                    
                    hayCambios = false;
                    habilitarBotonGrabar(false);
                    
                    mostrarLoading(false);
                    updateStatus('Permisos guardados exitosamente');
                    
                    // Mostrar mensaje de confirmación
                    mostrarMensaje('Los permisos han sido guardados correctamente.', 'success');
                    
                } catch (error) {
                    mostrarLoading(false);
                    mostrarMensaje('Error al guardar los permisos: ' + error.message, 'error');
                    updateStatus('Error al guardar permisos');
                }
            }, 1500);
        }

        function configurarBotones(enabled) {
            habilitarCheckboxes(enabled);
            if (!enabled) {
                habilitarBotonGrabar(false);
            }
        }

        function habilitarBotonGrabar(enabled) {
            const btnGrabar = document.getElementById('btnGrabar');
            btnGrabar.disabled = !enabled;
        }

        function mostrarLoading(mostrar) {
            const overlay = document.getElementById('loadingOverlay');
            if (mostrar) {
                overlay.classList.remove('hidden');
            } else {
                overlay.classList.add('hidden');
            }
        }

        function updateStatus(mensaje) {
            document.getElementById('statusMessage').textContent = mensaje;
        }

        function mostrarMensaje(mensaje, tipo) {
            let iconClass = '';
            let colorClass = '';
            
            switch (tipo) {
                case 'success':
                    iconClass = 'fas fa-check-circle';
                    colorClass = 'text-green-600';
                    break;
                case 'error':
                    iconClass = 'fas fa-exclamation-circle';
                    colorClass = 'text-red-600';
                    break;
                case 'warning':
                    iconClass = 'fas fa-exclamation-triangle';
                    colorClass = 'text-yellow-600';
                    break;
                default:
                    iconClass = 'fas fa-info-circle';
                    colorClass = 'text-blue-600';
            }
            
            // Crear toast notification
            const toast = document.createElement('div');
            toast.className = `fixed top-4 right-4 bg-white border border-gray-300 rounded-lg shadow-lg p-4 z-50 max-w-sm`;
            toast.innerHTML = `
                <div class="flex items-center">
                    <i class="${iconClass} ${colorClass} mr-3"></i>
                    <span class="text-gray-800">${mensaje}</span>
                    <button onclick="this.parentElement.parentElement.remove()" class="ml-3 text-gray-400 hover:text-gray-600">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            `;
            
            document.body.appendChild(toast);
            
            // Auto-remover después de 5 segundos
            setTimeout(() => {
                if (toast.parentElement) {
                    toast.remove();
                }
            }, 5000);
        }

        function cerrarVentana() {
            if (hayCambios) {
                const respuesta = confirm('¿Desea guardar los cambios antes de cerrar?');
                
                if (respuesta) {
                    grabarPermisos();
                    // Cerrar después de guardar
                    setTimeout(() => {
                        cerrarDefinitivo();
                    }, 2000);
                } else {
                    const confirmarSalir = confirm('Se perderán los cambios no guardados. ¿Está seguro?');
                    if (confirmarSalir) {
                        cerrarDefinitivo();
                    }
                }
            } else {
                cerrarDefinitivo();
            }
        }

        function cerrarDefinitivo() {
            if (window.opener && window.opener.actualizarPermisos) {
                window.opener.actualizarPermisos();
                window.close();
            } else if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    type: 'permisos_actualizados',
                    usuario: usuarioActual
                }, '*');
            } else {
                window.history.back();
            }
        }

        // Manejo de teclas
        document.addEventListener('keydown', function(event) {
            switch(event.key) {
                case 'Escape':
                    cerrarVentana();
                    break;
                case 'F2':
                    event.preventDefault();
                    grabarPermisos();
                    break;
                case 'ArrowUp':
                    if (event.target.id === 'dblstPermABM') {
                        // Permitir navegación normal
                        setTimeout(seleccionarModulo, 10);
                    }
                    break;
                case 'ArrowDown':
                    if (event.target.id === 'dblstPermABM') {
                        // Permitir navegación normal
                        setTimeout(seleccionarModulo, 10);
                    }
                    break;
            }
        });

        // Manejo de cierre de ventana
        window.addEventListener('beforeunload', function(event) {
            if (hayCambios) {
                event.preventDefault();
                event.returnValue = 'Hay cambios sin guardar. ¿Está seguro de que desea salir?';
            }
        });

        // Inicializar cuando se carga la página
        document.addEventListener('DOMContentLoaded', inicializar);
    </script>

    <style>
        /* Estilos para el select multiple */
        #dblstPermABM {
            appearance: none;
            background-image: none;
        }
        
        #dblstPermABM option {
            padding: 8px;
            border-bottom: 1px solid #e5e7eb;
        }
        
        #dblstPermABM option:hover {
            background-color: #f3f4f6;
        }
        
        #dblstPermABM option:checked {
            background-color: #dbeafe;
            color: #1d4ed8;
        }
        
        /* Animaciones */
        .bg-white {
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from { 
                transform: translateY(-20px); 
                opacity: 0; 
            }
            to { 
                transform: translateY(0); 
                opacity: 1; 
            }
        }
    </style>
</body>
</html>
