<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEG@SYS - Gestión de Líneas de Productos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'medical-blue': '#2563eb',
                        'medical-green': '#059669',
                        'medical-red': '#dc2626'
                    }
                }
            }
        }
    </script>
    <style>
        @media print {
            .no-print { display: none !important; }
            body { print-color-adjust: exact; }
            .print-header { display: block !important; }
        }
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .stats-card {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        .linea-farmaceutica {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        .linea-quirurgica {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .linea-laboratorio {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }
        .linea-radiologia {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
        }
        .linea-general {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }
        .linea-emergencia {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
        }
        .linea-especializada {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="gradient-bg text-white shadow-lg no-print">
        <div class="container mx-auto px-4 py-6">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <i class="fas fa-layer-group text-3xl"></i>
                    <div>
                        <h1 class="text-2xl font-bold">Sistema MEG@SYS</h1>
                        <p class="text-blue-100">Gestión de Líneas de Productos Médicos</p>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <button onclick="window.print()" class="bg-white text-blue-600 px-4 py-2 rounded-lg hover:bg-blue-50 transition-colors">
                        <i class="fas fa-print mr-2"></i>Imprimir
                    </button>
                    <button onclick="window.history.back()" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition-colors">
                        <i class="fas fa-arrow-left mr-2"></i>Volver
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Print Header -->
    <div class="print-header hidden">
        <div class="text-center border-b-2 border-blue-600 pb-4 mb-6">
            <h1 class="text-2xl font-bold text-blue-800">LISTADO DE LÍNEAS DE PRODUCTOS</h1>
            <p class="text-gray-600">Sistema MEG@SYS - Reporte Generado el <span id="print-date"></span></p>
        </div>
    </div>

    <div class="container mx-auto px-4 py-6">
        <!-- Controls Section -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6 no-print">
            <div class="flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center space-x-4">
                    <div class="relative">
                        <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        <input type="text" id="searchInput" placeholder="Buscar por código, nombre o descripción..." 
                               class="pl-10 pr-4 py-2 w-96 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <select id="categoriaFiltro" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                        <option value="">Todas las Categorías</option>
                        <option value="FARMACEUTICA">Farmacéutica</option>
                        <option value="QUIRURGICA">Quirúrgica</option>
                        <option value="LABORATORIO">Laboratorio</option>
                        <option value="RADIOLOGIA">Radiología</option>
                        <option value="GENERAL">General</option>
                        <option value="EMERGENCIA">Emergencia</option>
                        <option value="ESPECIALIZADA">Especializada</option>
                    </select>
                    <select id="estadoFiltro" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                        <option value="">Todos los Estados</option>
                        <option value="ACTIVA">Activa</option>
                        <option value="INACTIVA">Inactiva</option>
                        <option value="DESCONTINUADA">Descontinuada</option>
                    </select>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="text-sm text-gray-600">Vista:</span>
                    <button id="viewCards" onclick="toggleView('cards')" class="px-3 py-1 bg-blue-500 text-white rounded-lg text-sm hover:bg-blue-600 transition-colors">
                        <i class="fas fa-th-large mr-1"></i>Tarjetas
                    </button>
                    <button id="viewTable" onclick="toggleView('table')" class="px-3 py-1 bg-gray-300 text-gray-700 rounded-lg text-sm hover:bg-gray-400 transition-colors">
                        <i class="fas fa-table mr-1"></i>Tabla
                    </button>
                </div>
            </div>
        </div>

        <!-- Statistics Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-6">
            <div class="stats-card text-white p-6 rounded-lg shadow-lg">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-blue-100 text-sm uppercase tracking-wide">Total Líneas</p>
                        <p class="text-3xl font-bold" id="totalLineas">0</p>
                    </div>
                    <i class="fas fa-layer-group text-4xl text-blue-200"></i>
                </div>
            </div>
            <div class="bg-gradient-to-r from-green-400 to-green-600 text-white p-6 rounded-lg shadow-lg">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-green-100 text-sm uppercase tracking-wide">Activas</p>
                        <p class="text-3xl font-bold" id="totalActivas">0</p>
                    </div>
                    <i class="fas fa-check-circle text-4xl text-green-200"></i>
                </div>
            </div>
            <div class="bg-gradient-to-r from-blue-400 to-blue-600 text-white p-6 rounded-lg shadow-lg">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-blue-100 text-sm uppercase tracking-wide">Farmacéuticas</p>
                        <p class="text-3xl font-bold" id="totalFarmaceuticas">0</p>
                    </div>
                    <i class="fas fa-pills text-4xl text-blue-200"></i>
                </div>
            </div>
            <div class="bg-gradient-to-r from-purple-400 to-purple-600 text-white p-6 rounded-lg shadow-lg">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-purple-100 text-sm uppercase tracking-wide">Quirúrgicas</p>
                        <p class="text-3xl font-bold" id="totalQuirurgicas">0</p>
                    </div>
                    <i class="fas fa-scalpel text-4xl text-purple-200"></i>
                </div>
            </div>
        </div>

        <!-- Add New Button -->
        <div class="mb-6 no-print">
            <button onclick="agregarLinea()" class="bg-green-500 text-white px-6 py-3 rounded-lg hover:bg-green-600 transition-colors shadow-lg">
                <i class="fas fa-plus mr-2"></i>Agregar Nueva Línea
            </button>
        </div>

        <!-- Cards View -->
        <div id="cardsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards will be generated here -->
        </div>

        <!-- Table View -->
        <div id="tableContainer" class="hidden">
            <div class="bg-white rounded-lg shadow-lg overflow-hidden">
                <table class="min-w-full">
                    <thead class="bg-blue-600 text-white">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Código Línea</th>
                            <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Nombre</th>
                            <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Descripción</th>
                            <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Categoría</th>
                            <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Estado</th>
                            <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider no-print">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="bg-white divide-y divide-gray-200">
                        <!-- Table rows will be generated here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal for Add/Edit -->
    <div id="modalLinea" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden z-50 no-print">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full">
                <div class="bg-blue-600 text-white px-6 py-4 rounded-t-lg">
                    <h3 class="text-lg font-semibold" id="modalTitle">Agregar Nueva Línea</h3>
                </div>
                <form id="formLinea" class="p-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Código de Línea</label>
                            <input type="text" id="modalCodLinea" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Categoría</label>
                            <select id="modalCategoria" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required>
                                <option value="">Seleccionar categoría</option>
                                <option value="FARMACEUTICA">Farmacéutica</option>
                                <option value="QUIRURGICA">Quirúrgica</option>
                                <option value="LABORATORIO">Laboratorio</option>
                                <option value="RADIOLOGIA">Radiología</option>
                                <option value="GENERAL">General</option>
                                <option value="EMERGENCIA">Emergencia</option>
                                <option value="ESPECIALIZADA">Especializada</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Nombre de la Línea</label>
                        <input type="text" id="modalLinNombre" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Descripción</label>
                        <textarea id="modalDescripcion" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required placeholder="Descripción detallada de la línea de productos"></textarea>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Estado</label>
                            <select id="modalEstado" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required>
                                <option value="ACTIVA">Activa</option>
                                <option value="INACTIVA">Inactiva</option>
                                <option value="DESCONTINUADA">Descontinuada</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Fecha de Creación</label>
                            <input type="date" id="modalFechaCreacion" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required>
                        </div>
                    </div>
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Observaciones (Opcional)</label>
                        <textarea id="modalObservaciones" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="Observaciones adicionales"></textarea>
                    </div>
                    <div class="flex justify-end space-x-3">
                        <button type="button" onclick="cerrarModal()" class="px-4 py-2 text-gray-700 bg-gray-200 rounded-lg hover:bg-gray-300 transition-colors">
                            Cancelar
                        </button>
                        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                            Guardar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Sample data for demonstration
        let lineas = [
            {
                codLinea: 'FAR001',
                linNombre: 'ANALGESICOS Y ANTIINFLAMATORIOS',
                descripcion: 'Línea completa de medicamentos para el manejo del dolor y la inflamación',
                categoria: 'FARMACEUTICA',
                estado: 'ACTIVA',
                fechaCreacion: '2024-01-15',
                observaciones: 'Línea de alta rotación'
            },
            {
                codLinea: 'QUI001',
                linNombre: 'INSTRUMENTAL QUIRURGICO BASICO',
                descripcion: 'Instrumentos quirúrgicos de uso general para procedimientos básicos',
                categoria: 'QUIRURGICA',
                estado: 'ACTIVA',
                fechaCreacion: '2024-01-20',
                observaciones: 'Requiere esterilización'
            },
            {
                codLinea: 'LAB001',
                linNombre: 'REACTIVOS DE HEMATOLOGIA',
                descripcion: 'Reactivos y controles para análisis hematológicos completos',
                categoria: 'LABORATORIO',
                estado: 'ACTIVA',
                fechaCreacion: '2024-02-01',
                observaciones: 'Cadena de frío requerida'
            },
            {
                codLinea: 'RAD001',
                linNombre: 'MEDIOS DE CONTRASTE',
                descripcion: 'Medios de contraste para estudios radiológicos y tomográficos',
                categoria: 'RADIOLOGIA',
                estado: 'ACTIVA',
                fechaCreacion: '2024-02-10',
                observaciones: 'Fecha de vencimiento crítica'
            },
            {
                codLinea: 'GEN001',
                linNombre: 'MATERIAL DESECHABLE GENERAL',
                descripcion: 'Artículos desechables de uso general en todas las áreas',
                categoria: 'GENERAL',
                estado: 'ACTIVA',
                fechaCreacion: '2024-01-05',
                observaciones: 'Alto volumen de consumo'
            },
            {
                codLinea: 'EME001',
                linNombre: 'EQUIPO DE EMERGENCIAS',
                descripcion: 'Equipos y suministros para atención de emergencias médicas',
                categoria: 'EMERGENCIA',
                estado: 'ACTIVA',
                fechaCreacion: '2024-01-30',
                observaciones: 'Stock mínimo siempre disponible'
            },
            {
                codLinea: 'ESP001',
                linNombre: 'CARDIOLOGIA INTERVENCIONISTA',
                descripcion: 'Equipos especializados para procedimientos de cardiología intervencionista',
                categoria: 'ESPECIALIZADA',
                estado: 'ACTIVA',
                fechaCreacion: '2024-03-01',
                observaciones: 'Requiere capacitación especializada'
            },
            {
                codLinea: 'FAR002',
                linNombre: 'ANTIBIOTICOS DE ALTO ESPECTRO',
                descripcion: 'Antibióticos de amplio espectro para infecciones severas',
                categoria: 'FARMACEUTICA',
                estado: 'ACTIVA',
                fechaCreacion: '2024-02-15',
                observaciones: 'Control estricto de prescripción'
            },
            {
                codLinea: 'QUI002',
                linNombre: 'SUTURAS Y MATERIAL DE CIERRE',
                descripcion: 'Suturas, grapas y material para cierre de heridas quirúrgicas',
                categoria: 'QUIRURGICA',
                estado: 'ACTIVA',
                fechaCreacion: '2024-01-25',
                observaciones: 'Verificar fecha de vencimiento'
            },
            {
                codLinea: 'LAB002',
                linNombre: 'MICROBIOLOGIA CLINICA',
                descripcion: 'Medios de cultivo y reactivos para microbiología clínica',
                categoria: 'LABORATORIO',
                estado: 'INACTIVA',
                fechaCreacion: '2023-12-20',
                observaciones: 'En proceso de renovación'
            }
        ];

        let currentView = 'cards';
        let editingIndex = null;

        function initializeApp() {
            renderLineas();
            updateStatistics();
            setupEventListeners();
            updatePrintDate();
        }

        function setupEventListeners() {
            document.getElementById('searchInput').addEventListener('input', filterLineas);
            document.getElementById('categoriaFiltro').addEventListener('change', filterLineas);
            document.getElementById('estadoFiltro').addEventListener('change', filterLineas);
            document.getElementById('formLinea').addEventListener('submit', guardarLinea);
        }

        function updatePrintDate() {
            document.getElementById('print-date').textContent = new Date().toLocaleDateString('es-ES');
        }

        function renderLineas() {
            if (currentView === 'cards') {
                renderCards();
            } else {
                renderTable();
            }
        }

        function getCardClass(categoria) {
            switch(categoria) {
                case 'FARMACEUTICA': return 'linea-farmaceutica';
                case 'QUIRURGICA': return 'linea-quirurgica';
                case 'LABORATORIO': return 'linea-laboratorio';
                case 'RADIOLOGIA': return 'linea-radiologia';
                case 'GENERAL': return 'linea-general';
                case 'EMERGENCIA': return 'linea-emergencia';
                case 'ESPECIALIZADA': return 'linea-especializada';
                default: return 'linea-general';
            }
        }

        function getIconClass(categoria) {
            switch(categoria) {
                case 'FARMACEUTICA': return 'fas fa-pills';
                case 'QUIRURGICA': return 'fas fa-scalpel';
                case 'LABORATORIO': return 'fas fa-flask';
                case 'RADIOLOGIA': return 'fas fa-x-ray';
                case 'GENERAL': return 'fas fa-boxes';
                case 'EMERGENCIA': return 'fas fa-ambulance';
                case 'ESPECIALIZADA': return 'fas fa-microscope';
                default: return 'fas fa-layer-group';
            }
        }

        function renderCards() {
            const container = document.getElementById('cardsContainer');
            const filteredData = getFilteredLineas();
            
            container.innerHTML = filteredData.map(linea => {
                return `
                <div class="${getCardClass(linea.categoria)} text-white rounded-lg shadow-lg card-hover transition-all duration-300">
                    <div class="p-6">
                        <div class="flex items-center justify-between mb-4">
                            <div class="flex items-center space-x-3">
                                <div class="bg-white bg-opacity-20 p-3 rounded-full">
                                    <i class="${getIconClass(linea.categoria)} text-2xl"></i>
                                </div>
                                <div>
                                    <h3 class="text-lg font-bold">${linea.linNombre}</h3>
                                    <p class="text-blue-100">Código: ${linea.codLinea}</p>
                                </div>
                            </div>
                            <span class="px-2 py-1 bg-white bg-opacity-20 rounded text-sm font-bold">${linea.estado}</span>
                        </div>
                        
                        <div class="space-y-2 mb-4">
                            <div class="flex items-center justify-between">
                                <span class="text-sm">Categoría:</span>
                                <span class="font-semibold">${linea.categoria}</span>
                            </div>
                            <div class="text-sm">
                                <span class="block mb-1">Descripción:</span>
                                <span class="text-xs">${linea.descripcion}</span>
                            </div>
                            <div class="flex items-center justify-between">
                                <span class="text-sm">Creada:</span>
                                <span class="text-xs">${formatDate(linea.fechaCreacion)}</span>
                            </div>
                            ${linea.observaciones ? `
                            <div class="text-sm">
                                <span class="block mb-1">Observaciones:</span>
                                <span class="text-xs italic">${linea.observaciones}</span>
                            </div>
                            ` : ''}
                        </div>
                        
                        <div class="flex space-x-2 no-print">
                            <button onclick="editarLinea(${getOriginalIndex(linea)})" 
                                    class="flex-1 bg-white bg-opacity-20 hover:bg-opacity-30 text-white px-4 py-2 rounded-lg transition-colors">
                                <i class="fas fa-edit mr-2"></i>Editar
                            </button>
                            <button onclick="eliminarLinea(${getOriginalIndex(linea)})" 
                                    class="flex-1 bg-red-500 bg-opacity-80 hover:bg-opacity-100 text-white px-4 py-2 rounded-lg transition-colors">
                                <i class="fas fa-trash mr-2"></i>Eliminar
                            </button>
                        </div>
                    </div>
                </div>
            `;
            }).join('');
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const filteredData = getFilteredLineas();
            
            tbody.innerHTML = filteredData.map(linea => {
                const estadoBadge = getEstadoBadge(linea.estado);
                const categoriaBadge = getCategoriaBadge(linea.categoria);
                
                return `
                <tr class="hover:bg-gray-50">
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${linea.codLinea}</td>
                    <td class="px-6 py-4 text-sm text-gray-900">
                        <div class="font-medium">${linea.linNombre}</div>
                        <div class="text-xs text-gray-500">Creada: ${formatDate(linea.fechaCreacion)}</div>
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-900">${linea.descripcion}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        ${categoriaBadge}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        ${estadoBadge}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium no-print">
                        <button onclick="editarLinea(${getOriginalIndex(linea)})" class="text-blue-600 hover:text-blue-900 mr-3">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button onclick="eliminarLinea(${getOriginalIndex(linea)})" class="text-red-600 hover:text-red-900">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `;
            }).join('');
        }

        function getEstadoBadge(estado) {
            const badgeClasses = {
                'ACTIVA': 'bg-green-100 text-green-800',
                'INACTIVA': 'bg-yellow-100 text-yellow-800',
                'DESCONTINUADA': 'bg-red-100 text-red-800'
            };
            
            const icons = {
                'ACTIVA': 'fas fa-check-circle',
                'INACTIVA': 'fas fa-pause-circle',
                'DESCONTINUADA': 'fas fa-times-circle'
            };
            
            return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${badgeClasses[estado]}">
                        <i class="${icons[estado]} mr-1"></i>${estado}
                    </span>`;
        }

        function getCategoriaBadge(categoria) {
            const badgeClasses = {
                'FARMACEUTICA': 'bg-blue-100 text-blue-800',
                'QUIRURGICA': 'bg-purple-100 text-purple-800',
                'LABORATORIO': 'bg-green-100 text-green-800',
                'RADIOLOGIA': 'bg-orange-100 text-orange-800',
                'GENERAL': 'bg-gray-100 text-gray-800',
                'EMERGENCIA': 'bg-red-100 text-red-800',
                'ESPECIALIZADA': 'bg-teal-100 text-teal-800'
            };
            
            return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${badgeClasses[categoria]}">
                        <i class="${getIconClass(categoria)} mr-1"></i>${categoria}
                    </span>`;
        }

        function formatDate(dateString) {
            return new Date(dateString).toLocaleDateString('es-ES');
        }

        function getOriginalIndex(linea) {
            return lineas.findIndex(l => l.codLinea === linea.codLinea);
        }

        function getFilteredLineas() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const categoriaFiltro = document.getElementById('categoriaFiltro').value;
            const estadoFiltro = document.getElementById('estadoFiltro').value;
            
            return lineas.filter(linea => {
                const matchesSearch = !searchTerm || 
                    linea.codLinea.toLowerCase().includes(searchTerm) ||
                    linea.linNombre.toLowerCase().includes(searchTerm) ||
                    linea.descripcion.toLowerCase().includes(searchTerm);
                
                const matchesCategoria = !categoriaFiltro || linea.categoria === categoriaFiltro;
                const matchesEstado = !estadoFiltro || linea.estado === estadoFiltro;
                
                return matchesSearch && matchesCategoria && matchesEstado;
            });
        }

        function filterLineas() {
            renderLineas();
        }

        function toggleView(view) {
            currentView = view;
            
            const cardsContainer = document.getElementById('cardsContainer');
            const tableContainer = document.getElementById('tableContainer');
            const viewCards = document.getElementById('viewCards');
            const viewTable = document.getElementById('viewTable');
            
            if (view === 'cards') {
                cardsContainer.classList.remove('hidden');
                tableContainer.classList.add('hidden');
                viewCards.classList.remove('bg-gray-300', 'text-gray-700');
                viewCards.classList.add('bg-blue-500', 'text-white');
                viewTable.classList.remove('bg-blue-500', 'text-white');
                viewTable.classList.add('bg-gray-300', 'text-gray-700');
            } else {
                cardsContainer.classList.add('hidden');
                tableContainer.classList.remove('hidden');
                viewTable.classList.remove('bg-gray-300', 'text-gray-700');
                viewTable.classList.add('bg-blue-500', 'text-white');
                viewCards.classList.remove('bg-blue-500', 'text-white');
                viewCards.classList.add('bg-gray-300', 'text-gray-700');
            }
            
            renderLineas();
        }

        function updateStatistics() {
            const total = lineas.length;
            const activas = lineas.filter(l => l.estado === 'ACTIVA').length;
            const farmaceuticas = lineas.filter(l => l.categoria === 'FARMACEUTICA').length;
            const quirurgicas = lineas.filter(l => l.categoria === 'QUIRURGICA').length;
            
            document.getElementById('totalLineas').textContent = total;
            document.getElementById('totalActivas').textContent = activas;
            document.getElementById('totalFarmaceuticas').textContent = farmaceuticas;
            document.getElementById('totalQuirurgicas').textContent = quirurgicas;
        }

        function agregarLinea() {
            editingIndex = null;
            document.getElementById('modalTitle').textContent = 'Agregar Nueva Línea';
            document.getElementById('formLinea').reset();
            document.getElementById('modalFechaCreacion').value = new Date().toISOString().split('T')[0];
            document.getElementById('modalLinea').classList.remove('hidden');
        }

        function editarLinea(index) {
            editingIndex = index;
            const linea = lineas[index];
            
            document.getElementById('modalTitle').textContent = 'Editar Línea';
            document.getElementById('modalCodLinea').value = linea.codLinea;
            document.getElementById('modalLinNombre').value = linea.linNombre;
            document.getElementById('modalDescripcion').value = linea.descripcion;
            document.getElementById('modalCategoria').value = linea.categoria;
            document.getElementById('modalEstado').value = linea.estado;
            document.getElementById('modalFechaCreacion').value = linea.fechaCreacion;
            document.getElementById('modalObservaciones').value = linea.observaciones || '';
            
            document.getElementById('modalLinea').classList.remove('hidden');
        }

        function guardarLinea(event) {
            event.preventDefault();
            
            const formData = {
                codLinea: document.getElementById('modalCodLinea').value.trim(),
                linNombre: document.getElementById('modalLinNombre').value.trim(),
                descripcion: document.getElementById('modalDescripcion').value.trim(),
                categoria: document.getElementById('modalCategoria').value,
                estado: document.getElementById('modalEstado').value,
                fechaCreacion: document.getElementById('modalFechaCreacion').value,
                observaciones: document.getElementById('modalObservaciones').value.trim()
            };
            
            if (editingIndex !== null) {
                // Edit existing
                lineas[editingIndex] = formData;
            } else {
                // Add new
                if (lineas.find(l => l.codLinea === formData.codLinea)) {
                    alert('Ya existe una línea con ese código');
                    return;
                }
                lineas.push(formData);
            }
            
            renderLineas();
            updateStatistics();
            cerrarModal();
        }

        function eliminarLinea(index) {
            if (confirm('¿Está seguro de que desea eliminar esta línea?')) {
                lineas.splice(index, 1);
                renderLineas();
                updateStatistics();
            }
        }

        function cerrarModal() {
            document.getElementById('modalLinea').classList.add('hidden');
            editingIndex = null;
        }

        // Initialize the application
        document.addEventListener('DOMContentLoaded', initializeApp);
    </script>
</body>
</html>
