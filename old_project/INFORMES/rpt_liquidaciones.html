<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicios Prestados por Paciente - Sistema Galeno</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 12px;
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
            color: #333;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border: 2px solid #ff0000;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        
        .header-title {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            text-decoration: underline;
            margin: 20px 0;
            color: #2c3e50;
        }
        
        .ficha-numero {
            text-align: right;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #e74c3c;
        }
        
        .patient-section {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 20px;
            background-color: #f8f9fa;
        }
        
        .section-title {
            font-size: 12px;
            font-weight: normal;
            text-decoration: underline;
            margin-bottom: 10px;
            color: #34495e;
        }
        
        .patient-info {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .patient-field {
            font-weight: bold;
            color: #2c3e50;
        }
        
        .service-header {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 10px;
            background-color: #e8f4fd;
        }
        
        .service-info {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }
        
        .service-title {
            font-size: 12px;
            font-weight: normal;
            text-decoration: underline;
            margin-bottom: 10px;
            color: #34495e;
        }
        
        .table-container {
            overflow-x: auto;
            margin-bottom: 20px;
        }
        
        .services-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        
        .services-table th {
            background-color: #34495e;
            color: white;
            padding: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 11px;
            border: 1px solid #2c3e50;
        }
        
        .services-table td {
            padding: 6px 8px;
            border: 1px solid #ddd;
            font-size: 11px;
            text-align: center;
        }
        
        .services-table tbody tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        
        .services-table tbody tr:hover {
            background-color: #e3f2fd;
        }
        
        .type-column {
            text-align: center;
            width: 80px;
        }
        
        .code-column {
            text-align: center;
            width: 100px;
        }
        
        .name-column {
            text-align: left;
            width: 300px;
        }
        
        .quantity-column, .cost-column, .fee-column, .honors-column {
            text-align: right;
            width: 80px;
        }
        
        .total-row {
            background-color: #2c3e50 !important;
            color: white;
            font-weight: bold;
        }
        
        .total-row td {
            border-color: #2c3e50;
        }
        
        .footer {
            border-top: 1px solid #333;
            padding-top: 10px;
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #666;
        }
        
        .page-info {
            font-weight: bold;
        }
        
        .navigation {
            text-align: center;
            margin-top: 20px;
        }
        
        .nav-button {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            margin: 0 5px;
            cursor: pointer;
            border-radius: 4px;
        }
        
        .nav-button:hover {
            background: #0056b3;
        }
        
        .currency {
            color: #27ae60;
            font-weight: bold;
        }
        
        @media print {
            body { 
                background: white; 
                padding: 0; 
            }
            .container { 
                border: none; 
                box-shadow: none; 
                max-width: none; 
            }
            .navigation { 
                display: none; 
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-title">SERVICIOS PRESTADOS POR PACIENTE</div>
        
        <div id="liquidacion-content">
            <!-- Contenido de liquidación dinámico se carga aquí -->
        </div>
        
        <div class="navigation">
            <button class="nav-button" onclick="previousLiquidacion()">← Anterior</button>
            <button class="nav-button" onclick="nextLiquidacion()">Siguiente →</button>
            <button class="nav-button" onclick="printLiquidacion()">🖨️ Imprimir</button>
        </div>
    </div>

    <script>
        const liquidaciones = [
            {
                fichaclinica: "LIQ-001",
                paciente: {
                    tipdoc: "CI",
                    nrodoc: "12345678",
                    nombres: "Juan Carlos González",
                    apellidos: "Rodríguez"
                },
                servicios: [
                    {
                        fecPed: "20/01/2024",
                        nromov: "001",
                        detalles: [
                            {
                                tiposer: "CONS",
                                codservicio: "C001",
                                nomservicio: "Consulta Médica General",
                                cantidad: 1,
                                costo: 50000,
                                arancel: 45000,
                                honorarios: 35000
                            },
                            {
                                tiposer: "LAB",
                                codservicio: "L001",
                                nomservicio: "Hemograma Completo",
                                cantidad: 1,
                                costo: 25000,
                                arancel: 22000,
                                honorarios: 18000
                            },
                            {
                                tiposer: "LAB",
                                codservicio: "L002",
                                nomservicio: "Bioquímica Sanguínea",
                                cantidad: 1,
                                costo: 35000,
                                arancel: 32000,
                                honorarios: 28000
                            }
                        ]
                    },
                    {
                        fecPed: "25/01/2024",
                        nromov: "002",
                        detalles: [
                            {
                                tiposer: "IMG",
                                codservicio: "I001",
                                nomservicio: "Ecografía Abdominal",
                                cantidad: 1,
                                costo: 80000,
                                arancel: 75000,
                                honorarios: 65000
                            },
                            {
                                tiposer: "CONS",
                                codservicio: "C002",
                                nomservicio: "Consulta de Control",
                                cantidad: 1,
                                costo: 40000,
                                arancel: 35000,
                                honorarios: 30000
                            }
                        ]
                    }
                ]
            },
            {
                fichaclinica: "LIQ-002",
                paciente: {
                    tipdoc: "CI",
                    nrodoc: "87654321",
                    nombres: "Ana María López",
                    apellidos: "de Martínez"
                },
                servicios: [
                    {
                        fecPed: "22/01/2024",
                        nromov: "003",
                        detalles: [
                            {
                                tiposer: "OBS",
                                codservicio: "O001",
                                nomservicio: "Control Prenatal",
                                cantidad: 1,
                                costo: 60000,
                                arancel: 55000,
                                honorarios: 45000
                            },
                            {
                                tiposer: "IMG",
                                codservicio: "I002",
                                nomservicio: "Ecografía Obstétrica",
                                cantidad: 1,
                                costo: 90000,
                                arancel: 85000,
                                honorarios: 75000
                            },
                            {
                                tiposer: "LAB",
                                codservicio: "L003",
                                nomservicio: "Perfil Obstétrico",
                                cantidad: 1,
                                costo: 45000,
                                arancel: 40000,
                                honorarios: 35000
                            }
                        ]
                    }
                ]
            }
        ];

        let currentIndex = 0;

        function formatCurrency(amount) {
            return new Intl.NumberFormat('es-CO', {
                style: 'currency',
                currency: 'COP',
                minimumFractionDigits: 0
            }).format(amount);
        }

        function calculateTotals(servicios) {
            let totalCosto = 0;
            let totalArancel = 0;
            let totalHonorarios = 0;
            
            servicios.forEach(servicio => {
                servicio.detalles.forEach(detalle => {
                    totalCosto += detalle.costo * detalle.cantidad;
                    totalArancel += detalle.arancel * detalle.cantidad;
                    totalHonorarios += detalle.honorarios * detalle.cantidad;
                });
            });
            
            return {
                costo: totalCosto,
                arancel: totalArancel,
                honorarios: totalHonorarios
            };
        }

        function loadLiquidacion(index) {
            const liquidacion = liquidaciones[index];
            const content = document.getElementById('liquidacion-content');
            const totales = calculateTotals(liquidacion.servicios);
            
            let serviciosHtml = '';
            
            liquidacion.servicios.forEach(servicio => {
                serviciosHtml += `
                    <div class="service-header">
                        <div class="service-title">FECHA Y Nº DE SERVICIO</div>
                        <div class="service-info">
                            <div><strong>Fecha:</strong> ${servicio.fecPed}</div>
                            <div><strong>Nº Movimiento:</strong> ${servicio.nromov}</div>
                        </div>
                        
                        <div class="table-container">
                            <table class="services-table">
                                <thead>
                                    <tr>
                                        <th class="type-column">TIPO</th>
                                        <th class="code-column">CÓDIGO</th>
                                        <th class="name-column">NOMBRE</th>
                                        <th class="quantity-column">CANTIDAD</th>
                                        <th class="cost-column">COSTO</th>
                                        <th class="fee-column">ARANCEL</th>
                                        <th class="honors-column">HONORARIOS</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${servicio.detalles.map(detalle => `
                                        <tr>
                                            <td class="type-column">${detalle.tiposer}</td>
                                            <td class="code-column">${detalle.codservicio}</td>
                                            <td class="name-column">${detalle.nomservicio}</td>
                                            <td class="quantity-column">${detalle.cantidad}</td>
                                            <td class="cost-column currency">${formatCurrency(detalle.costo)}</td>
                                            <td class="fee-column currency">${formatCurrency(detalle.arancel)}</td>
                                            <td class="honors-column currency">${formatCurrency(detalle.honorarios)}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            });
            
            content.innerHTML = `
                <div class="ficha-numero">FICHA CLÍNICA Nº ${liquidacion.fichaclinica}</div>
                
                <div class="patient-section">
                    <div class="section-title">DATOS DEL PACIENTE</div>
                    <div class="patient-info">
                        <div class="patient-field">${liquidacion.paciente.tipdoc}: ${liquidacion.paciente.nrodoc}</div>
                        <div class="patient-field">${liquidacion.paciente.nombres} ${liquidacion.paciente.apellidos}</div>
                    </div>
                </div>
                
                ${serviciosHtml}
                
                <div class="table-container">
                    <table class="services-table">
                        <tbody>
                            <tr class="total-row">
                                <td colspan="4"><strong>TOTALES GENERALES</strong></td>
                                <td class="cost-column"><strong>${formatCurrency(totales.costo)}</strong></td>
                                <td class="fee-column"><strong>${formatCurrency(totales.arancel)}</strong></td>
                                <td class="honors-column"><strong>${formatCurrency(totales.honorarios)}</strong></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <div class="footer">
                    <div>
                        <span>Fecha: ${new Date().toLocaleDateString('es-ES')}</span>
                        <span style="margin-left: 20px;">Hora: ${new Date().toLocaleTimeString('es-ES')}</span>
                    </div>
                    <div class="page-info">PÁGINA: 1</div>
                </div>
            `;
        }

        function nextLiquidacion() {
            currentIndex = (currentIndex + 1) % liquidaciones.length;
            loadLiquidacion(currentIndex);
        }

        function previousLiquidacion() {
            currentIndex = (currentIndex - 1 + liquidaciones.length) % liquidaciones.length;
            loadLiquidacion(currentIndex);
        }

        function printLiquidacion() {
            window.print();
        }

        // Cargar primera liquidación al inicio
        loadLiquidacion(0);

        // Atajos de teclado
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight') nextLiquidacion();
            if (e.key === 'ArrowLeft') previousLiquidacion();
            if (e.ctrlKey && e.key === 'p') {
                e.preventDefault();
                printLiquidacion();
            }
        });
    </script>
</body>
</html>
