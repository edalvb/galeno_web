<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEG@SYS - Lista de Pacientes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'medical-blue': '#2563eb',
                        'medical-green': '#059669',
                        'medical-red': '#dc2626'
                    }
                }
            }
        }
    </script>
    <style>
        @media print {
            .no-print { display: none !important; }
            body { print-color-adjust: exact; }
            .print-header { display: block !important; }
        }
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .stats-card {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        .patient-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .paciente-masculino {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        .paciente-femenino {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }
        .paciente-adulto {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }
        .paciente-menor {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="gradient-bg text-white shadow-lg no-print">
        <div class="container mx-auto px-4 py-6">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <i class="fas fa-users text-3xl"></i>
                    <div>
                        <h1 class="text-2xl font-bold">Sistema MEG@SYS</h1>
                        <p class="text-blue-100">Gestión de Pacientes</p>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <button onclick="window.print()" class="bg-white text-blue-600 px-4 py-2 rounded-lg hover:bg-blue-50 transition-colors">
                        <i class="fas fa-print mr-2"></i>Imprimir
                    </button>
                    <button onclick="window.history.back()" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition-colors">
                        <i class="fas fa-arrow-left mr-2"></i>Volver
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Print Header -->
    <div class="print-header hidden">
        <div class="text-center border-b-2 border-blue-600 pb-4 mb-6">
            <h1 class="text-2xl font-bold text-blue-800">LISTADO DE PACIENTES</h1>
            <p class="text-gray-600">Sistema MEG@SYS - Reporte Generado el <span id="print-date"></span></p>
        </div>
    </div>

    <div class="container mx-auto px-4 py-6">
        <!-- Controls Section -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6 no-print">
            <div class="flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center space-x-4">
                    <div class="relative">
                        <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        <input type="text" id="searchInput" placeholder="Buscar por documento, nombres, apellidos..." 
                               class="pl-10 pr-4 py-2 w-96 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <select id="edadFiltro" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                        <option value="">Todas las Edades</option>
                        <option value="MENOR">Menores (0-17)</option>
                        <option value="ADULTO">Adultos (18-59)</option>
                        <option value="MAYOR">Mayores (60+)</option>
                    </select>
                    <select id="generoFiltro" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                        <option value="">Todos los Géneros</option>
                        <option value="M">Masculino</option>
                        <option value="F">Femenino</option>
                    </select>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="text-sm text-gray-600">Vista:</span>
                    <button id="viewCards" onclick="toggleView('cards')" class="px-3 py-1 bg-blue-500 text-white rounded-lg text-sm hover:bg-blue-600 transition-colors">
                        <i class="fas fa-th-large mr-1"></i>Tarjetas
                    </button>
                    <button id="viewTable" onclick="toggleView('table')" class="px-3 py-1 bg-gray-300 text-gray-700 rounded-lg text-sm hover:bg-gray-400 transition-colors">
                        <i class="fas fa-table mr-1"></i>Tabla
                    </button>
                </div>
            </div>
        </div>

        <!-- Statistics Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-6">
            <div class="stats-card text-white p-6 rounded-lg shadow-lg">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-blue-100 text-sm uppercase tracking-wide">Total Pacientes</p>
                        <p class="text-3xl font-bold" id="totalPacientes">0</p>
                    </div>
                    <i class="fas fa-users text-4xl text-blue-200"></i>
                </div>
            </div>
            <div class="bg-gradient-to-r from-blue-400 to-blue-600 text-white p-6 rounded-lg shadow-lg">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-blue-100 text-sm uppercase tracking-wide">Hombres</p>
                        <p class="text-3xl font-bold" id="totalHombres">0</p>
                    </div>
                    <i class="fas fa-male text-4xl text-blue-200"></i>
                </div>
            </div>
            <div class="bg-gradient-to-r from-pink-400 to-pink-600 text-white p-6 rounded-lg shadow-lg">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-pink-100 text-sm uppercase tracking-wide">Mujeres</p>
                        <p class="text-3xl font-bold" id="totalMujeres">0</p>
                    </div>
                    <i class="fas fa-female text-4xl text-pink-200"></i>
                </div>
            </div>
            <div class="bg-gradient-to-r from-green-400 to-green-600 text-white p-6 rounded-lg shadow-lg">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-green-100 text-sm uppercase tracking-wide">Promedio Edad</p>
                        <p class="text-3xl font-bold"><span id="promedioEdad">0</span> años</p>
                    </div>
                    <i class="fas fa-calendar-alt text-4xl text-green-200"></i>
                </div>
            </div>
        </div>

        <!-- Add New Button -->
        <div class="mb-6 no-print">
            <button onclick="agregarPaciente()" class="bg-green-500 text-white px-6 py-3 rounded-lg hover:bg-green-600 transition-colors shadow-lg">
                <i class="fas fa-plus mr-2"></i>Agregar Nuevo Paciente
            </button>
        </div>

        <!-- Cards View -->
        <div id="cardsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards will be generated here -->
        </div>

        <!-- Table View -->
        <div id="tableContainer" class="hidden">
            <div class="bg-white rounded-lg shadow-lg overflow-hidden">
                <table class="min-w-full">
                    <thead class="bg-blue-600 text-white">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">N° Doc</th>
                            <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Nombres</th>
                            <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Apellidos</th>
                            <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Apellido Casada</th>
                            <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Fecha Nac</th>
                            <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Teléfonos</th>
                            <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider no-print">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="bg-white divide-y divide-gray-200">
                        <!-- Table rows will be generated here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal for Add/Edit -->
    <div id="modalPaciente" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden z-50 no-print">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg shadow-xl max-w-lg w-full max-h-screen overflow-y-auto">
                <div class="bg-blue-600 text-white px-6 py-4 rounded-t-lg">
                    <h3 class="text-lg font-semibold" id="modalTitle">Agregar Nuevo Paciente</h3>
                </div>
                <form id="formPaciente" class="p-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="mb-4 md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-2">Número de Documento</label>
                            <input type="text" id="modalNroDoc" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required>
                        </div>
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2">Nombres</label>
                            <input type="text" id="modalNombres" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required>
                        </div>
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2">Apellidos</label>
                            <input type="text" id="modalApellidos" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Apellido de Casada (Opcional)</label>
                        <input type="text" id="modalApeCasada" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2">Fecha de Nacimiento</label>
                            <input type="date" id="modalFecNac" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required>
                        </div>
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2">Género</label>
                            <select id="modalGenero" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required>
                                <option value="">Seleccionar</option>
                                <option value="M">Masculino</option>
                                <option value="F">Femenino</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Teléfonos</label>
                        <input type="text" id="modalTelefonos" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="Ej: 300-123-4567, 601-234-5678">
                    </div>
                    <div class="flex justify-end space-x-3">
                        <button type="button" onclick="cerrarModal()" class="px-4 py-2 text-gray-700 bg-gray-200 rounded-lg hover:bg-gray-300 transition-colors">
                            Cancelar
                        </button>
                        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                            Guardar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Sample data for demonstration
        let pacientes = [
            {
                nrodoc: '12345678',
                nombres: 'CARLOS ALBERTO',
                apellidos: 'GONZÁLEZ RODRÍGUEZ',
                apecasada: '',
                fecnac: '1985-03-15',
                telefonos: '300-123-4567, 601-234-5678',
                genero: 'M'
            },
            {
                nrodoc: '87654321',
                nombres: 'MARÍA ELENA',
                apellidos: 'MARTÍNEZ LÓPEZ',
                apecasada: 'DE GARCÍA',
                fecnac: '1992-07-22',
                telefonos: '310-987-6543',
                genero: 'F'
            },
            {
                nrodoc: '11223344',
                nombres: 'LUIS FERNANDO',
                apellidos: 'PÉREZ SILVA',
                apecasada: '',
                fecnac: '1978-11-08',
                telefonos: '320-555-1234',
                genero: 'M'
            },
            {
                nrodoc: '55667788',
                nombres: 'ANA PATRICIA',
                apellidos: 'TORRES VARGAS',
                apecasada: '',
                fecnac: '1988-05-14',
                telefonos: '315-444-7777',
                genero: 'F'
            },
            {
                nrodoc: '99887766',
                nombres: 'JORGE EDUARDO',
                apellidos: 'RAMÍREZ CASTRO',
                apecasada: '',
                fecnac: '1995-12-03',
                telefonos: '300-666-8888',
                genero: 'M'
            },
            {
                nrodoc: '44556677',
                nombres: 'SANDRA MILENA',
                apellidos: 'JIMÉNEZ MORALES',
                apecasada: '',
                fecnac: '1990-09-17',
                telefonos: '310-999-0000',
                genero: 'F'
            },
            {
                nrodoc: '33445566',
                nombres: 'PEDRO JOSÉ',
                apellidos: 'LÓPEZ HERNÁNDEZ',
                apecasada: '',
                fecnac: '2010-01-25',
                telefonos: '317-111-2222',
                genero: 'M'
            },
            {
                nrodoc: '66778899',
                nombres: 'ROSA MARÍA',
                apellidos: 'VARGAS SÁNCHEZ',
                apecasada: '',
                fecnac: '1955-04-12',
                telefonos: '318-333-4444',
                genero: 'F'
            }
        ];

        let currentView = 'cards';
        let editingIndex = null;

        function initializeApp() {
            renderPacientes();
            updateStatistics();
            setupEventListeners();
            updatePrintDate();
        }

        function setupEventListeners() {
            document.getElementById('searchInput').addEventListener('input', filterPacientes);
            document.getElementById('edadFiltro').addEventListener('change', filterPacientes);
            document.getElementById('generoFiltro').addEventListener('change', filterPacientes);
            document.getElementById('formPaciente').addEventListener('submit', guardarPaciente);
        }

        function updatePrintDate() {
            document.getElementById('print-date').textContent = new Date().toLocaleDateString('es-ES');
        }

        function calcularEdad(fechaNac) {
            const hoy = new Date();
            const nacimiento = new Date(fechaNac);
            let edad = hoy.getFullYear() - nacimiento.getFullYear();
            const mes = hoy.getMonth() - nacimiento.getMonth();
            if (mes < 0 || (mes === 0 && hoy.getDate() < nacimiento.getDate())) {
                edad--;
            }
            return edad;
        }

        function categoriaEdad(edad) {
            if (edad < 18) return 'MENOR';
            if (edad < 60) return 'ADULTO';
            return 'MAYOR';
        }

        function renderPacientes() {
            if (currentView === 'cards') {
                renderCards();
            } else {
                renderTable();
            }
        }

        function getCardClass(paciente) {
            const edad = calcularEdad(paciente.fecnac);
            if (paciente.genero === 'M') return 'paciente-masculino';
            if (paciente.genero === 'F') return 'paciente-femenino';
            return 'patient-card';
        }

        function getIconClass(paciente) {
            const edad = calcularEdad(paciente.fecnac);
            if (edad < 18) return 'fas fa-child';
            if (paciente.genero === 'M') return 'fas fa-male';
            if (paciente.genero === 'F') return 'fas fa-female';
            return 'fas fa-user';
        }

        function renderCards() {
            const container = document.getElementById('cardsContainer');
            const filteredData = getFilteredPacientes();
            
            container.innerHTML = filteredData.map(paciente => {
                const edad = calcularEdad(paciente.fecnac);
                const nombreCompleto = `${paciente.nombres} ${paciente.apellidos}${paciente.apecasada ? ' ' + paciente.apecasada : ''}`;
                
                return `
                <div class="${getCardClass(paciente)} text-white rounded-lg shadow-lg card-hover transition-all duration-300">
                    <div class="p-6">
                        <div class="flex items-center justify-between mb-4">
                            <div class="flex items-center space-x-3">
                                <div class="bg-white bg-opacity-20 p-3 rounded-full">
                                    <i class="${getIconClass(paciente)} text-2xl"></i>
                                </div>
                                <div>
                                    <h3 class="text-lg font-bold">${nombreCompleto}</h3>
                                    <p class="text-blue-100">Doc: ${paciente.nrodoc}</p>
                                </div>
                            </div>
                            <div class="text-center">
                                <span class="px-3 py-1 bg-white bg-opacity-20 rounded-full text-sm font-medium">
                                    ${edad} años
                                </span>
                            </div>
                        </div>
                        
                        <div class="space-y-2 mb-4">
                            <div class="flex items-center space-x-2">
                                <i class="fas fa-calendar text-blue-200"></i>
                                <span class="text-sm">${new Date(paciente.fecnac).toLocaleDateString('es-ES')}</span>
                            </div>
                            <div class="flex items-center space-x-2">
                                <i class="fas fa-phone text-blue-200"></i>
                                <span class="text-sm">${paciente.telefonos}</span>
                            </div>
                            <div class="flex items-center space-x-2">
                                <i class="fas fa-venus-mars text-blue-200"></i>
                                <span class="text-sm">${paciente.genero === 'M' ? 'Masculino' : 'Femenino'}</span>
                            </div>
                        </div>
                        
                        <div class="flex space-x-2 no-print">
                            <button onclick="editarPaciente(${getOriginalIndex(paciente)})" 
                                    class="flex-1 bg-white bg-opacity-20 hover:bg-opacity-30 text-white px-4 py-2 rounded-lg transition-colors">
                                <i class="fas fa-edit mr-2"></i>Editar
                            </button>
                            <button onclick="eliminarPaciente(${getOriginalIndex(paciente)})" 
                                    class="flex-1 bg-red-500 bg-opacity-80 hover:bg-opacity-100 text-white px-4 py-2 rounded-lg transition-colors">
                                <i class="fas fa-trash mr-2"></i>Eliminar
                            </button>
                        </div>
                    </div>
                </div>
            `;
            }).join('');
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const filteredData = getFilteredPacientes();
            
            tbody.innerHTML = filteredData.map(paciente => `
                <tr class="hover:bg-gray-50">
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${paciente.nrodoc}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${paciente.nombres}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${paciente.apellidos}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${paciente.apecasada || '-'}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${new Date(paciente.fecnac).toLocaleDateString('es-ES')}</td>
                    <td class="px-6 py-4 text-sm text-gray-900">${paciente.telefonos}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium no-print">
                        <button onclick="editarPaciente(${getOriginalIndex(paciente)})" class="text-blue-600 hover:text-blue-900 mr-3">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button onclick="eliminarPaciente(${getOriginalIndex(paciente)})" class="text-red-600 hover:text-red-900">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function getOriginalIndex(paciente) {
            return pacientes.findIndex(p => p.nrodoc === paciente.nrodoc);
        }

        function getFilteredPacientes() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const edadFiltro = document.getElementById('edadFiltro').value;
            const generoFiltro = document.getElementById('generoFiltro').value;
            
            return pacientes.filter(paciente => {
                const edad = calcularEdad(paciente.fecnac);
                const categoriaEdadPaciente = categoriaEdad(edad);
                
                const matchesSearch = !searchTerm || 
                    paciente.nrodoc.toLowerCase().includes(searchTerm) ||
                    paciente.nombres.toLowerCase().includes(searchTerm) ||
                    paciente.apellidos.toLowerCase().includes(searchTerm) ||
                    paciente.apecasada.toLowerCase().includes(searchTerm) ||
                    paciente.telefonos.toLowerCase().includes(searchTerm);
                
                const matchesEdad = !edadFiltro || categoriaEdadPaciente === edadFiltro;
                const matchesGenero = !generoFiltro || paciente.genero === generoFiltro;
                
                return matchesSearch && matchesEdad && matchesGenero;
            });
        }

        function filterPacientes() {
            renderPacientes();
        }

        function toggleView(view) {
            currentView = view;
            
            const cardsContainer = document.getElementById('cardsContainer');
            const tableContainer = document.getElementById('tableContainer');
            const viewCards = document.getElementById('viewCards');
            const viewTable = document.getElementById('viewTable');
            
            if (view === 'cards') {
                cardsContainer.classList.remove('hidden');
                tableContainer.classList.add('hidden');
                viewCards.classList.remove('bg-gray-300', 'text-gray-700');
                viewCards.classList.add('bg-blue-500', 'text-white');
                viewTable.classList.remove('bg-blue-500', 'text-white');
                viewTable.classList.add('bg-gray-300', 'text-gray-700');
            } else {
                cardsContainer.classList.add('hidden');
                tableContainer.classList.remove('hidden');
                viewTable.classList.remove('bg-gray-300', 'text-gray-700');
                viewTable.classList.add('bg-blue-500', 'text-white');
                viewCards.classList.remove('bg-blue-500', 'text-white');
                viewCards.classList.add('bg-gray-300', 'text-gray-700');
            }
            
            renderPacientes();
        }

        function updateStatistics() {
            const total = pacientes.length;
            const hombres = pacientes.filter(p => p.genero === 'M').length;
            const mujeres = pacientes.filter(p => p.genero === 'F').length;
            const edades = pacientes.map(p => calcularEdad(p.fecnac));
            const promedioEdad = edades.reduce((sum, edad) => sum + edad, 0) / edades.length;
            
            document.getElementById('totalPacientes').textContent = total;
            document.getElementById('totalHombres').textContent = hombres;
            document.getElementById('totalMujeres').textContent = mujeres;
            document.getElementById('promedioEdad').textContent = Math.round(promedioEdad);
        }

        function agregarPaciente() {
            editingIndex = null;
            document.getElementById('modalTitle').textContent = 'Agregar Nuevo Paciente';
            document.getElementById('formPaciente').reset();
            document.getElementById('modalPaciente').classList.remove('hidden');
        }

        function editarPaciente(index) {
            editingIndex = index;
            const paciente = pacientes[index];
            
            document.getElementById('modalTitle').textContent = 'Editar Paciente';
            document.getElementById('modalNroDoc').value = paciente.nrodoc;
            document.getElementById('modalNombres').value = paciente.nombres;
            document.getElementById('modalApellidos').value = paciente.apellidos;
            document.getElementById('modalApeCasada').value = paciente.apecasada;
            document.getElementById('modalFecNac').value = paciente.fecnac;
            document.getElementById('modalGenero').value = paciente.genero;
            document.getElementById('modalTelefonos').value = paciente.telefonos;
            
            document.getElementById('modalPaciente').classList.remove('hidden');
        }

        function guardarPaciente(event) {
            event.preventDefault();
            
            const formData = {
                nrodoc: document.getElementById('modalNroDoc').value.trim(),
                nombres: document.getElementById('modalNombres').value.trim(),
                apellidos: document.getElementById('modalApellidos').value.trim(),
                apecasada: document.getElementById('modalApeCasada').value.trim(),
                fecnac: document.getElementById('modalFecNac').value,
                genero: document.getElementById('modalGenero').value,
                telefonos: document.getElementById('modalTelefonos').value.trim()
            };
            
            if (editingIndex !== null) {
                // Edit existing
                pacientes[editingIndex] = formData;
            } else {
                // Add new
                if (pacientes.find(p => p.nrodoc === formData.nrodoc)) {
                    alert('Ya existe un paciente con ese número de documento');
                    return;
                }
                pacientes.push(formData);
            }
            
            renderPacientes();
            updateStatistics();
            cerrarModal();
        }

        function eliminarPaciente(index) {
            if (confirm('¿Está seguro de que desea eliminar este paciente?')) {
                pacientes.splice(index, 1);
                renderPacientes();
                updateStatistics();
            }
        }

        function cerrarModal() {
            document.getElementById('modalPaciente').classList.add('hidden');
            editingIndex = null;
        }

        // Initialize the application
        document.addEventListener('DOMContentLoaded', initializeApp);
    </script>
</body>
</html>
