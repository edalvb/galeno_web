<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEG@SYS - Directorio de Institutos Médicos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'medical-blue': '#2563eb',
                        'medical-green': '#059669',
                        'medical-red': '#dc2626'
                    }
                }
            }
        }
    </script>
    <style>
        @media print {
            .no-print { display: none !important; }
            body { print-color-adjust: exact; }
            .print-header { display: block !important; }
        }
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .stats-card {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        .instituto-publico {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .instituto-privado {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }
        .instituto-mixto {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
        }
        .instituto-especializado {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }
        .instituto-clinica {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        .instituto-hospital {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="gradient-bg text-white shadow-lg no-print">
        <div class="container mx-auto px-4 py-6">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <i class="fas fa-hospital text-3xl"></i>
                    <div>
                        <h1 class="text-2xl font-bold">Sistema MEG@SYS</h1>
                        <p class="text-blue-100">Gestión de Institutos Médicos</p>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <button onclick="window.print()" class="bg-white text-blue-600 px-4 py-2 rounded-lg hover:bg-blue-50 transition-colors">
                        <i class="fas fa-print mr-2"></i>Imprimir
                    </button>
                    <button onclick="window.history.back()" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition-colors">
                        <i class="fas fa-arrow-left mr-2"></i>Volver
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Print Header -->
    <div class="print-header hidden">
        <div class="text-center border-b-2 border-blue-600 pb-4 mb-6">
            <h1 class="text-2xl font-bold text-blue-800">LISTADO DE INSTITUTOS MÉDICOS</h1>
            <p class="text-gray-600">Sistema MEG@SYS - Reporte Generado el <span id="print-date"></span></p>
        </div>
    </div>

    <div class="container mx-auto px-4 py-6">
        <!-- Controls Section -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6 no-print">
            <div class="flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center space-x-4">
                    <div class="relative">
                        <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        <input type="text" id="searchInput" placeholder="Buscar por código, nombre o dirección..." 
                               class="pl-10 pr-4 py-2 w-96 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <select id="tipoFiltro" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                        <option value="">Todos los Tipos</option>
                        <option value="PUBLICO">Público</option>
                        <option value="PRIVADO">Privado</option>
                        <option value="MIXTO">Mixto</option>
                        <option value="ESPECIALIZADO">Especializado</option>
                        <option value="CLINICA">Clínica</option>
                        <option value="HOSPITAL">Hospital</option>
                    </select>
                    <select id="ciudadFiltro" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                        <option value="">Todas las Ciudades</option>
                        <option value="BOGOTA">Bogotá</option>
                        <option value="MEDELLIN">Medellín</option>
                        <option value="CALI">Cali</option>
                        <option value="BARRANQUILLA">Barranquilla</option>
                        <option value="CARTAGENA">Cartagena</option>
                    </select>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="text-sm text-gray-600">Vista:</span>
                    <button id="viewCards" onclick="toggleView('cards')" class="px-3 py-1 bg-blue-500 text-white rounded-lg text-sm hover:bg-blue-600 transition-colors">
                        <i class="fas fa-th-large mr-1"></i>Tarjetas
                    </button>
                    <button id="viewTable" onclick="toggleView('table')" class="px-3 py-1 bg-gray-300 text-gray-700 rounded-lg text-sm hover:bg-gray-400 transition-colors">
                        <i class="fas fa-table mr-1"></i>Tabla
                    </button>
                </div>
            </div>
        </div>

        <!-- Statistics Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-6">
            <div class="stats-card text-white p-6 rounded-lg shadow-lg">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-blue-100 text-sm uppercase tracking-wide">Total Institutos</p>
                        <p class="text-3xl font-bold" id="totalInstitutos">0</p>
                    </div>
                    <i class="fas fa-hospital text-4xl text-blue-200"></i>
                </div>
            </div>
            <div class="bg-gradient-to-r from-blue-400 to-blue-600 text-white p-6 rounded-lg shadow-lg">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-blue-100 text-sm uppercase tracking-wide">Públicos</p>
                        <p class="text-3xl font-bold" id="totalPublicos">0</p>
                    </div>
                    <i class="fas fa-university text-4xl text-blue-200"></i>
                </div>
            </div>
            <div class="bg-gradient-to-r from-green-400 to-green-600 text-white p-6 rounded-lg shadow-lg">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-green-100 text-sm uppercase tracking-wide">Privados</p>
                        <p class="text-3xl font-bold" id="totalPrivados">0</p>
                    </div>
                    <i class="fas fa-building text-4xl text-green-200"></i>
                </div>
            </div>
            <div class="bg-gradient-to-r from-purple-400 to-purple-600 text-white p-6 rounded-lg shadow-lg">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-purple-100 text-sm uppercase tracking-wide">Especializados</p>
                        <p class="text-3xl font-bold" id="totalEspecializados">0</p>
                    </div>
                    <i class="fas fa-microscope text-4xl text-purple-200"></i>
                </div>
            </div>
        </div>

        <!-- Add New Button -->
        <div class="mb-6 no-print">
            <button onclick="agregarInstituto()" class="bg-green-500 text-white px-6 py-3 rounded-lg hover:bg-green-600 transition-colors shadow-lg">
                <i class="fas fa-plus mr-2"></i>Agregar Nuevo Instituto
            </button>
        </div>

        <!-- Cards View -->
        <div id="cardsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards will be generated here -->
        </div>

        <!-- Table View -->
        <div id="tableContainer" class="hidden">
            <div class="bg-white rounded-lg shadow-lg overflow-hidden">
                <table class="min-w-full">
                    <thead class="bg-blue-600 text-white">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Código</th>
                            <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Instituto</th>
                            <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Domicilio</th>
                            <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Teléfonos</th>
                            <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Tipo</th>
                            <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider no-print">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="bg-white divide-y divide-gray-200">
                        <!-- Table rows will be generated here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal for Add/Edit -->
    <div id="modalInstituto" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden z-50 no-print">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full">
                <div class="bg-blue-600 text-white px-6 py-4 rounded-t-lg">
                    <h3 class="text-lg font-semibold" id="modalTitle">Agregar Nuevo Instituto</h3>
                </div>
                <form id="formInstituto" class="p-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Código Instituto</label>
                            <input type="text" id="modalCodins" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Tipo de Instituto</label>
                            <select id="modalTipo" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required>
                                <option value="">Seleccionar tipo</option>
                                <option value="PUBLICO">Público</option>
                                <option value="PRIVADO">Privado</option>
                                <option value="MIXTO">Mixto</option>
                                <option value="ESPECIALIZADO">Especializado</option>
                                <option value="CLINICA">Clínica</option>
                                <option value="HOSPITAL">Hospital</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Nombre del Instituto</label>
                        <input type="text" id="modalInstituto" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Domicilio</label>
                        <textarea id="modalDomicilio" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required></textarea>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Teléfono Principal</label>
                            <input type="tel" id="modalTelef1" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Teléfono Secundario</label>
                            <input type="tel" id="modalTelef2" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Ciudad</label>
                            <select id="modalCiudad" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required>
                                <option value="">Seleccionar ciudad</option>
                                <option value="BOGOTA">Bogotá</option>
                                <option value="MEDELLIN">Medellín</option>
                                <option value="CALI">Cali</option>
                                <option value="BARRANQUILLA">Barranquilla</option>
                                <option value="CARTAGENA">Cartagena</option>
                                <option value="BUCARAMANGA">Bucaramanga</option>
                                <option value="PEREIRA">Pereira</option>
                                <option value="MANIZALES">Manizales</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Descripción/Servicios (Opcional)</label>
                        <textarea id="modalDescripcion" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="Descripción de servicios ofrecidos"></textarea>
                    </div>
                    <div class="flex justify-end space-x-3">
                        <button type="button" onclick="cerrarModal()" class="px-4 py-2 text-gray-700 bg-gray-200 rounded-lg hover:bg-gray-300 transition-colors">
                            Cancelar
                        </button>
                        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                            Guardar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Sample data for demonstration
        let institutos = [
            {
                codins: 'INS001',
                instituto: 'HOSPITAL UNIVERSITARIO SAN IGNACIO',
                domicilio: 'Carrera 7 No. 40-62, Bogotá',
                telef1: '3208320',
                telef2: '3208300',
                tipo: 'PUBLICO',
                ciudad: 'BOGOTA',
                descripcion: 'Hospital universitario de alta complejidad'
            },
            {
                codins: 'INS002',
                instituto: 'CLINICA COLOMBIA',
                domicilio: 'Calle 24 No. 29-45, Bogotá',
                telef1: '3434343',
                telef2: '3434344',
                tipo: 'PRIVADO',
                ciudad: 'BOGOTA',
                descripcion: 'Clínica especializada en cirugía'
            },
            {
                codins: 'INS003',
                instituto: 'HOSPITAL PABLO TOBÓN URIBE',
                domicilio: 'Calle 78B No. 69-240, Medellín',
                telef1: '4459000',
                telef2: '4459001',
                tipo: 'PRIVADO',
                ciudad: 'MEDELLIN',
                descripcion: 'Hospital de alta complejidad'
            },
            {
                codins: 'INS004',
                instituto: 'CENTRO MÉDICO IMBANACO',
                domicilio: 'Carrera 38A No. 5A-100, Cali',
                telef1: '5552200',
                telef2: '5552201',
                tipo: 'ESPECIALIZADO',
                ciudad: 'CALI',
                descripción: 'Centro especializado en medicina interna'
            },
            {
                codins: 'INS005',
                instituto: 'HOSPITAL UNIVERSITARIO DEL CARIBE',
                domicilio: 'Calle 80 No. 20-86, Cartagena',
                telef1: '6504040',
                telef2: '6504041',
                tipo: 'PUBLICO',
                ciudad: 'CARTAGENA',
                descripcion: 'Hospital público universitario'
            },
            {
                codins: 'INS006',
                instituto: 'CLINICA LAS AMERICAS',
                domicilio: 'Diagonal 75B No. 2A-80, Medellín',
                telef1: '3420420',
                telef2: '3420421',
                tipo: 'PRIVADO',
                ciudad: 'MEDELLIN',
                descripcion: 'Clínica de alta complejidad'
            },
            {
                codins: 'INS007',
                instituto: 'FUNDACION VALLE DEL LILI',
                domicilio: 'Carrera 98 No. 18-49, Cali',
                telef1: '3319090',
                telef2: '3319091',
                tipo: 'MIXTO',
                ciudad: 'CALI',
                descripcion: 'Fundación médica sin ánimo de lucro'
            },
            {
                codins: 'INS008',
                instituto: 'HOSPITAL MILITAR CENTRAL',
                domicilio: 'Transversal 3 No. 49-00, Bogotá',
                telef1: '3480000',
                telef2: '3480001',
                tipo: 'ESPECIALIZADO',
                ciudad: 'BOGOTA',
                descripcion: 'Hospital especializado militar'
            }
        ];

        let currentView = 'cards';
        let editingIndex = null;

        function initializeApp() {
            renderInstitutos();
            updateStatistics();
            setupEventListeners();
            updatePrintDate();
        }

        function setupEventListeners() {
            document.getElementById('searchInput').addEventListener('input', filterInstitutos);
            document.getElementById('tipoFiltro').addEventListener('change', filterInstitutos);
            document.getElementById('ciudadFiltro').addEventListener('change', filterInstitutos);
            document.getElementById('formInstituto').addEventListener('submit', guardarInstituto);
        }

        function updatePrintDate() {
            document.getElementById('print-date').textContent = new Date().toLocaleDateString('es-ES');
        }

        function renderInstitutos() {
            if (currentView === 'cards') {
                renderCards();
            } else {
                renderTable();
            }
        }

        function getCardClass(tipo) {
            switch(tipo) {
                case 'PUBLICO': return 'instituto-publico';
                case 'PRIVADO': return 'instituto-privado';
                case 'MIXTO': return 'instituto-mixto';
                case 'ESPECIALIZADO': return 'instituto-especializado';
                case 'CLINICA': return 'instituto-clinica';
                case 'HOSPITAL': return 'instituto-hospital';
                default: return 'instituto-publico';
            }
        }

        function getIconClass(tipo) {
            switch(tipo) {
                case 'PUBLICO': return 'fas fa-university';
                case 'PRIVADO': return 'fas fa-building';
                case 'MIXTO': return 'fas fa-handshake';
                case 'ESPECIALIZADO': return 'fas fa-microscope';
                case 'CLINICA': return 'fas fa-clinic-medical';
                case 'HOSPITAL': return 'fas fa-hospital';
                default: return 'fas fa-hospital';
            }
        }

        function renderCards() {
            const container = document.getElementById('cardsContainer');
            const filteredData = getFilteredInstitutos();
            
            container.innerHTML = filteredData.map(instituto => {
                return `
                <div class="${getCardClass(instituto.tipo)} text-white rounded-lg shadow-lg card-hover transition-all duration-300">
                    <div class="p-6">
                        <div class="flex items-center justify-between mb-4">
                            <div class="flex items-center space-x-3">
                                <div class="bg-white bg-opacity-20 p-3 rounded-full">
                                    <i class="${getIconClass(instituto.tipo)} text-2xl"></i>
                                </div>
                                <div>
                                    <h3 class="text-lg font-bold">${instituto.instituto}</h3>
                                    <p class="text-blue-100">Código: ${instituto.codins}</p>
                                </div>
                            </div>
                        </div>
                        
                        <div class="space-y-2 mb-4">
                            <div class="flex items-center justify-between">
                                <span class="text-sm">Tipo:</span>
                                <span class="px-2 py-1 bg-white bg-opacity-20 rounded text-sm">${instituto.tipo}</span>
                            </div>
                            <div class="flex items-center justify-between">
                                <span class="text-sm">Ciudad:</span>
                                <span class="font-semibold">${instituto.ciudad}</span>
                            </div>
                            <div class="text-sm">
                                <span class="block mb-1">Dirección:</span>
                                <span class="text-xs">${instituto.domicilio}</span>
                            </div>
                            <div class="text-sm">
                                <span class="block mb-1">Teléfonos:</span>
                                <div class="flex space-x-2">
                                    <span class="px-2 py-1 bg-white bg-opacity-20 rounded text-xs">${instituto.telef1}</span>
                                    ${instituto.telef2 ? `<span class="px-2 py-1 bg-white bg-opacity-20 rounded text-xs">${instituto.telef2}</span>` : ''}
                                </div>
                            </div>
                        </div>
                        
                        <div class="flex space-x-2 no-print">
                            <button onclick="editarInstituto(${getOriginalIndex(instituto)})" 
                                    class="flex-1 bg-white bg-opacity-20 hover:bg-opacity-30 text-white px-4 py-2 rounded-lg transition-colors">
                                <i class="fas fa-edit mr-2"></i>Editar
                            </button>
                            <button onclick="eliminarInstituto(${getOriginalIndex(instituto)})" 
                                    class="flex-1 bg-red-500 bg-opacity-80 hover:bg-opacity-100 text-white px-4 py-2 rounded-lg transition-colors">
                                <i class="fas fa-trash mr-2"></i>Eliminar
                            </button>
                        </div>
                    </div>
                </div>
            `;
            }).join('');
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const filteredData = getFilteredInstitutos();
            
            tbody.innerHTML = filteredData.map(instituto => {
                const tipoBadge = getTipoBadge(instituto.tipo);
                
                return `
                <tr class="hover:bg-gray-50">
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${instituto.codins}</td>
                    <td class="px-6 py-4 text-sm text-gray-900">
                        <div class="font-medium">${instituto.instituto}</div>
                        <div class="text-xs text-gray-500">${instituto.ciudad}</div>
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-900">${instituto.domicilio}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                        <div>${instituto.telef1}</div>
                        ${instituto.telef2 ? `<div class="text-xs text-gray-500">${instituto.telef2}</div>` : ''}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        ${tipoBadge}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium no-print">
                        <button onclick="editarInstituto(${getOriginalIndex(instituto)})" class="text-blue-600 hover:text-blue-900 mr-3">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button onclick="eliminarInstituto(${getOriginalIndex(instituto)})" class="text-red-600 hover:text-red-900">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `;
            }).join('');
        }

        function getTipoBadge(tipo) {
            const badgeClasses = {
                'PUBLICO': 'bg-blue-100 text-blue-800',
                'PRIVADO': 'bg-green-100 text-green-800',
                'MIXTO': 'bg-yellow-100 text-yellow-800',
                'ESPECIALIZADO': 'bg-purple-100 text-purple-800',
                'CLINICA': 'bg-teal-100 text-teal-800',
                'HOSPITAL': 'bg-pink-100 text-pink-800'
            };
            
            return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${badgeClasses[tipo]}">
                        <i class="${getIconClass(tipo)} mr-1"></i>${tipo}
                    </span>`;
        }

        function getOriginalIndex(instituto) {
            return institutos.findIndex(i => i.codins === instituto.codins);
        }

        function getFilteredInstitutos() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const tipoFiltro = document.getElementById('tipoFiltro').value;
            const ciudadFiltro = document.getElementById('ciudadFiltro').value;
            
            return institutos.filter(instituto => {
                const matchesSearch = !searchTerm || 
                    instituto.codins.toLowerCase().includes(searchTerm) ||
                    instituto.instituto.toLowerCase().includes(searchTerm) ||
                    instituto.domicilio.toLowerCase().includes(searchTerm);
                
                const matchesTipo = !tipoFiltro || instituto.tipo === tipoFiltro;
                const matchesCiudad = !ciudadFiltro || instituto.ciudad === ciudadFiltro;
                
                return matchesSearch && matchesTipo && matchesCiudad;
            });
        }

        function filterInstitutos() {
            renderInstitutos();
        }

        function toggleView(view) {
            currentView = view;
            
            const cardsContainer = document.getElementById('cardsContainer');
            const tableContainer = document.getElementById('tableContainer');
            const viewCards = document.getElementById('viewCards');
            const viewTable = document.getElementById('viewTable');
            
            if (view === 'cards') {
                cardsContainer.classList.remove('hidden');
                tableContainer.classList.add('hidden');
                viewCards.classList.remove('bg-gray-300', 'text-gray-700');
                viewCards.classList.add('bg-blue-500', 'text-white');
                viewTable.classList.remove('bg-blue-500', 'text-white');
                viewTable.classList.add('bg-gray-300', 'text-gray-700');
            } else {
                cardsContainer.classList.add('hidden');
                tableContainer.classList.remove('hidden');
                viewTable.classList.remove('bg-gray-300', 'text-gray-700');
                viewTable.classList.add('bg-blue-500', 'text-white');
                viewCards.classList.remove('bg-blue-500', 'text-white');
                viewCards.classList.add('bg-gray-300', 'text-gray-700');
            }
            
            renderInstitutos();
        }

        function updateStatistics() {
            const total = institutos.length;
            const publicos = institutos.filter(i => i.tipo === 'PUBLICO').length;
            const privados = institutos.filter(i => i.tipo === 'PRIVADO').length;
            const especializados = institutos.filter(i => i.tipo === 'ESPECIALIZADO').length;
            
            document.getElementById('totalInstitutos').textContent = total;
            document.getElementById('totalPublicos').textContent = publicos;
            document.getElementById('totalPrivados').textContent = privados;
            document.getElementById('totalEspecializados').textContent = especializados;
        }

        function agregarInstituto() {
            editingIndex = null;
            document.getElementById('modalTitle').textContent = 'Agregar Nuevo Instituto';
            document.getElementById('formInstituto').reset();
            document.getElementById('modalInstituto').classList.remove('hidden');
        }

        function editarInstituto(index) {
            editingIndex = index;
            const instituto = institutos[index];
            
            document.getElementById('modalTitle').textContent = 'Editar Instituto';
            document.getElementById('modalCodins').value = instituto.codins;
            document.getElementById('modalInstituto').value = instituto.instituto;
            document.getElementById('modalDomicilio').value = instituto.domicilio;
            document.getElementById('modalTelef1').value = instituto.telef1;
            document.getElementById('modalTelef2').value = instituto.telef2 || '';
            document.getElementById('modalTipo').value = instituto.tipo;
            document.getElementById('modalCiudad').value = instituto.ciudad;
            document.getElementById('modalDescripcion').value = instituto.descripcion || '';
            
            document.getElementById('modalInstituto').classList.remove('hidden');
        }

        function guardarInstituto(event) {
            event.preventDefault();
            
            const formData = {
                codins: document.getElementById('modalCodins').value.trim(),
                instituto: document.getElementById('modalInstituto').value.trim(),
                domicilio: document.getElementById('modalDomicilio').value.trim(),
                telef1: document.getElementById('modalTelef1').value.trim(),
                telef2: document.getElementById('modalTelef2').value.trim(),
                tipo: document.getElementById('modalTipo').value,
                ciudad: document.getElementById('modalCiudad').value,
                descripcion: document.getElementById('modalDescripcion').value.trim()
            };
            
            if (editingIndex !== null) {
                // Edit existing
                institutos[editingIndex] = formData;
            } else {
                // Add new
                if (institutos.find(i => i.codins === formData.codins)) {
                    alert('Ya existe un instituto con ese código');
                    return;
                }
                institutos.push(formData);
            }
            
            renderInstitutos();
            updateStatistics();
            cerrarModal();
        }

        function eliminarInstituto(index) {
            if (confirm('¿Está seguro de que desea eliminar este instituto?')) {
                institutos.splice(index, 1);
                renderInstitutos();
                updateStatistics();
            }
        }

        function cerrarModal() {
            document.getElementById('modalInstituto').classList.add('hidden');
            editingIndex = null;
        }

        // Initialize the application
        document.addEventListener('DOMContentLoaded', initializeApp);
    </script>
</body>
</html>
