<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicios Prestados por Institutos - Sistema Galeno</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 12px;
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
            color: #333;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border: 2px solid #ff0000;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        
        .header-title {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            text-decoration: underline;
            margin: 20px 0;
            color: #2c3e50;
        }
        
        .institute-section {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 20px;
            background-color: #e8f4fd;
        }
        
        .institute-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .institute-code {
            font-weight: bold;
            color: #2c3e50;
            font-size: 14px;
        }
        
        .institute-name {
            font-weight: bold;
            color: #34495e;
            font-size: 14px;
        }
        
        .service-header {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 10px;
            background-color: #f8f9fa;
        }
        
        .service-info {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        
        .field {
            display: flex;
            gap: 5px;
        }
        
        .field-label {
            font-weight: bold;
        }
        
        .field-value {
            color: #495057;
        }
        
        .patient-info {
            margin-top: 10px;
            font-weight: bold;
            color: #2c3e50;
        }
        
        .services-title {
            font-size: 14px;
            font-weight: bold;
            margin: 15px 0 10px 0;
            color: #2c3e50;
        }
        
        .table-container {
            overflow-x: auto;
            margin-bottom: 20px;
        }
        
        .services-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        
        .services-table th {
            background-color: #34495e;
            color: white;
            padding: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 11px;
            border: 1px solid #2c3e50;
        }
        
        .services-table td {
            padding: 6px 8px;
            border: 1px solid #ddd;
            font-size: 11px;
        }
        
        .services-table tbody tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        
        .services-table tbody tr:hover {
            background-color: #e3f2fd;
        }
        
        .type-column {
            text-align: center;
            width: 60px;
        }
        
        .code-column {
            text-align: center;
            width: 100px;
        }
        
        .code2-column {
            text-align: center;
            width: 80px;
        }
        
        .name-column {
            text-align: left;
            width: 250px;
        }
        
        .quantity-column, .cost-column, .fee-column {
            text-align: right;
            width: 90px;
        }
        
        .total-section {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
        }
        
        .total-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        
        .footer {
            border-top: 1px solid #333;
            padding-top: 10px;
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #666;
        }
        
        .page-info {
            font-weight: bold;
        }
        
        .navigation {
            text-align: center;
            margin-top: 20px;
        }
        
        .nav-button {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            margin: 0 5px;
            cursor: pointer;
            border-radius: 4px;
        }
        
        .nav-button:hover {
            background: #0056b3;
        }
        
        .currency {
            color: #27ae60;
            font-weight: bold;
        }
        
        .separator-line {
            border-top: 1px solid #ccc;
            margin: 15px 0;
        }
        
        @media print {
            body { 
                background: white; 
                padding: 0; 
            }
            .container { 
                border: none; 
                box-shadow: none; 
                max-width: none; 
            }
            .navigation { 
                display: none; 
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-title">SERVICIOS PRESTADOS POR INSTITUTOS</div>
        
        <div id="instituto-content">
            <!-- Contenido de instituto dinámico se carga aquí -->
        </div>
        
        <div class="navigation">
            <button class="nav-button" onclick="previousInstituto()">← Anterior</button>
            <button class="nav-button" onclick="nextInstituto()">Siguiente →</button>
            <button class="nav-button" onclick="printInstituto()">🖨️ Imprimir</button>
        </div>
    </div>

    <script>
        const institutos = [
            {
                codins: "INS001",
                instituto: "Hospital General San Juan",
                servicios: [
                    {
                        fecPed: "20/01/2024",
                        nromov: "001",
                        fichaclinica: "HC-001",
                        paciente: {
                            tipdoc: "CI",
                            nrodoc: "12345678",
                            nombres: "Juan Carlos",
                            apellidos: "González"
                        },
                        detalles: [
                            {
                                tiposer: "CONS",
                                codservicio: "C001",
                                codser: "CGRAL",
                                nomservicio: "Consulta Médica General",
                                cantidad: 1,
                                costo: 50000,
                                arancel: 45000
                            },
                            {
                                tiposer: "LAB",
                                codservicio: "L001",
                                codser: "HEMOG",
                                nomservicio: "Hemograma Completo",
                                cantidad: 1,
                                costo: 25000,
                                arancel: 22000
                            }
                        ]
                    },
                    {
                        fecPed: "22/01/2024",
                        nromov: "002",
                        fichaclinica: "HC-002",
                        paciente: {
                            tipdoc: "CI",
                            nrodoc: "87654321",
                            nombres: "Ana María",
                            apellidos: "López de Martínez"
                        },
                        detalles: [
                            {
                                tiposer: "IMG",
                                codservicio: "I001",
                                codser: "ECOAB",
                                nomservicio: "Ecografía Abdominal",
                                cantidad: 1,
                                costo: 80000,
                                arancel: 75000
                            }
                        ]
                    }
                ]
            },
            {
                codins: "INS002",
                instituto: "Clínica Especializada Santa María",
                servicios: [
                    {
                        fecPed: "23/01/2024",
                        nromov: "003",
                        fichaclinica: "HC-003",
                        paciente: {
                            tipdoc: "CI",
                            nrodoc: "11223344",
                            nombres: "Carlos Eduardo",
                            apellidos: "Ramírez"
                        },
                        detalles: [
                            {
                                tiposer: "OBS",
                                codservicio: "O001",
                                codser: "CPREN",
                                nomservicio: "Control Prenatal",
                                cantidad: 1,
                                costo: 60000,
                                arancel: 55000
                            },
                            {
                                tiposer: "LAB",
                                codservicio: "L003",
                                codser: "POBS",
                                nomservicio: "Perfil Obstétrico Completo",
                                cantidad: 1,
                                costo: 45000,
                                arancel: 40000
                            }
                        ]
                    }
                ]
            }
        ];

        let currentIndex = 0;

        function formatCurrency(amount) {
            return new Intl.NumberFormat('es-CO', {
                style: 'currency',
                currency: 'COP',
                minimumFractionDigits: 0
            }).format(amount);
        }

        function calculateTotals(servicios) {
            let totalCosto = 0;
            let totalArancel = 0;
            
            servicios.forEach(servicio => {
                servicio.detalles.forEach(detalle => {
                    totalCosto += detalle.costo * detalle.cantidad;
                    totalArancel += detalle.arancel * detalle.cantidad;
                });
            });
            
            return {
                costo: totalCosto,
                arancel: totalArancel
            };
        }

        function loadInstituto(index) {
            const instituto = institutos[index];
            const content = document.getElementById('instituto-content');
            const totales = calculateTotals(instituto.servicios);
            
            let serviciosHtml = '';
            
            instituto.servicios.forEach(servicio => {
                serviciosHtml += `
                    <div class="service-header">
                        <div style="font-weight: bold; margin-bottom: 10px; color: #2c3e50;">
                            FECHA Y Nº DE SERVICIO
                        </div>
                        <div class="service-info">
                            <div class="field">
                                <span class="field-label">Fecha:</span>
                                <span class="field-value">${servicio.fecPed}</span>
                            </div>
                            <div class="field">
                                <span class="field-label">Nº Mov:</span>
                                <span class="field-value">${servicio.nromov}</span>
                            </div>
                            <div class="field">
                                <span class="field-label">Ficha Clínica:</span>
                                <span class="field-value">${servicio.fichaclinica}</span>
                            </div>
                        </div>
                        <div class="patient-info">
                            DATOS DEL PACIENTE: ${servicio.paciente.tipdoc} ${servicio.paciente.nrodoc} - ${servicio.paciente.nombres} ${servicio.paciente.apellidos}
                        </div>
                        
                        <div class="services-title">SERVICIOS</div>
                        
                        <div class="table-container">
                            <table class="services-table">
                                <thead>
                                    <tr>
                                        <th class="type-column">TIPO</th>
                                        <th class="code-column">COD. SERVICIO</th>
                                        <th class="code2-column">COD. SER</th>
                                        <th class="name-column">NOMBRE</th>
                                        <th class="quantity-column">CANTIDAD</th>
                                        <th class="cost-column">COSTO</th>
                                        <th class="fee-column">ARANCEL</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${servicio.detalles.map(detalle => `
                                        <tr>
                                            <td class="type-column">${detalle.tiposer}</td>
                                            <td class="code-column">${detalle.codservicio}</td>
                                            <td class="code2-column">${detalle.codser}</td>
                                            <td class="name-column">${detalle.nomservicio}</td>
                                            <td class="quantity-column">${detalle.cantidad}</td>
                                            <td class="cost-column currency">${formatCurrency(detalle.costo)}</td>
                                            <td class="fee-column currency">${formatCurrency(detalle.arancel)}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div class="separator-line"></div>
                `;
            });
            
            content.innerHTML = `
                <div class="institute-section">
                    <div class="institute-header">
                        <div>INSTITUTO:</div>
                        <div class="institute-code">${instituto.codins}</div>
                        <div class="institute-name">${instituto.instituto}</div>
                    </div>
                </div>
                
                ${serviciosHtml}
                
                <div class="total-section">
                    <div class="total-row">
                        <span><strong>TOTAL COSTO:</strong></span>
                        <span class="currency"><strong>${formatCurrency(totales.costo)}</strong></span>
                    </div>
                    <div class="total-row">
                        <span><strong>TOTAL ARANCEL:</strong></span>
                        <span class="currency"><strong>${formatCurrency(totales.arancel)}</strong></span>
                    </div>
                    <div class="total-row">
                        <span><strong>DIFERENCIA:</strong></span>
                        <span class="currency"><strong>${formatCurrency(totales.costo - totales.arancel)}</strong></span>
                    </div>
                </div>
                
                <div class="footer">
                    <div>
                        <span>Fecha: ${new Date().toLocaleDateString('es-ES')}</span>
                        <span style="margin-left: 20px;">Hora: ${new Date().toLocaleTimeString('es-ES')}</span>
                    </div>
                    <div class="page-info">PÁGINA: 1</div>
                </div>
            `;
        }

        function nextInstituto() {
            currentIndex = (currentIndex + 1) % institutos.length;
            loadInstituto(currentIndex);
        }

        function previousInstituto() {
            currentIndex = (currentIndex - 1 + institutos.length) % institutos.length;
            loadInstituto(currentIndex);
        }

        function printInstituto() {
            window.print();
        }

        // Cargar primer instituto al inicio
        loadInstituto(0);

        // Atajos de teclado
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight') nextInstituto();
            if (e.key === 'ArrowLeft') previousInstituto();
            if (e.ctrlKey && e.key === 'p') {
                e.preventDefault();
                printInstituto();
            }
        });
    </script>
</body>
</html>
